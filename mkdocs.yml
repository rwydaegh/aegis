site_name: AEGIS Documentation
site_url: https://docs.aegis.waves-ugent.be/
site_description: Geometric dosimetry engine for wireless exposure assessment
site_author: rwydaegh
repo_url: https://github.com/rwydaegh/aegis
repo_name: rwydaegh/aegis

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    logo: material/shield-sun
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - User guide:
    - Quickstart: user_guide/quickstart.md
    - Overview: user_guide/overview.md
    - FAQ: user_guide/faq.md
    - Troubleshooting: user_guide/troubleshooting.md
    - Batch runner: user_guide/batch_runner.md
    - DiffeRT integration: user_guide/differt_integration.md
    - Sionna RT integration: user_guide/sionna_integration.md
    - Stochastic channel: user_guide/stochastic_channel.md
    - Interactive viewer: user_guide/viewer.md
    - Deployment: user_guide/deployment.md
    - Fidelity levels: user_guide/fidelity_levels.md
    - Tissue and Fresnel: user_guide/tissue.md
    - Geometry: user_guide/geometry.md
    - Compliance: user_guide/compliance.md
    - Coherent MIMO: user_guide/coherent.md
    - Optimization: user_guide/optimization.md
  - Developer guide:
    - Architecture: developer_guide/architecture.md
    - Adding a kernel: developer_guide/adding_a_kernel.md
    - Testing: developer_guide/testing.md
    - Development machine: developer_guide/cloud_machine.md
    - Agent workflow (Claude & Cursor): developer_guide/claude_code_workflow.md
  - Reference:
    - API reference: reference/api.md
  - Internal:
    - Feature inventory: internal/features.md
    - Phase -1 hand-off: internal/phase_minus1_handoff.md
    - Phase 1 hand-off: internal/phase1_handoff.md
    - Phase 2 hand-off: internal/phase2_handoff.md
    - Phase 3 hand-off: internal/phase3_handoff.md
    - Phase 4 hand-off: internal/phase4_handoff.md
    - Phase 5 hand-off: internal/phase5_handoff.md
    - Roadmap Phase 1 hand-off: internal/roadmap_phase1_handoff.md
    - Location loading plan: internal/plan_location_loading.md
    - Viewer bug report: internal/viewer_bug_report.md
    - Viewer feature backlog: internal/viewer_feature_backlog.md
    - Viewer testing prompt: internal/viewer_testing_prompt.md
    - Implementation plan: internal/implementation_plan.md
    - Execution plan: internal/plan.md
    - Project proposal: internal/project_proposal.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            members_order: source
            filters:
              - '!^_'
              - ^__init__$

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js

extra_css:
  - stylesheets/extra.css
