name: QA agent

on:
  schedule:
    - cron: "0 */2 * * *"  # Every 2 hours
  workflow_dispatch: {}     # Manual trigger for testing

concurrency:
  group: qa-agent
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for git log

      - name: Get recent commits
        id: commits
        run: |
          RECENT=$(git log --oneline --since="2 days ago" --no-merges -100)
          if [ -z "$RECENT" ]; then
            RECENT=$(git log --oneline -20 --no-merges)
          fi
          {
            echo "log<<COMMITS_EOF"
            echo "$RECENT"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Pick random focus area
        id: focus
        run: |
          AREAS=(
            "Antenna placement, WASD movement, and phantom rotation"
            "Dosimetry HUD, compliance panel, and quantity toggles"
            "OSM environment loading and terrain"
            "Ray tracing and stochastic propagation"
            "MIMO multi-user mode"
            "Parameter controls, frequency bands, and exposure scenarios"
            "Export, analysis panels, and data quality"
            "Camera controls and viewpoints"
            "Base station panel and coverage maps"
            "Bug reporter (Shift+B), keyboard help (?), and guided tour"
          )
          INDEX=$((RANDOM % ${#AREAS[@]}))
          echo "area=${AREAS[$INDEX]}" >> "$GITHUB_OUTPUT"

      - name: Load prompt
        id: load_prompt
        run: |
          {
            echo "content<<PROMPT_EOF"
            cat agent_hq/prompts/qa-tester.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/aegis-overview.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/not-bugs.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run QA agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-7 --allowedTools "Edit,Read,Write,Glob,Grep,Bash(*),WebSearch,WebFetch,Agent"'
          prompt: |
            ${{ steps.load_prompt.outputs.content }}

            ## Your focus area this session

            **${{ steps.focus.outputs.area }}**

            Start here, but don't limit yourself. Use the app naturally.

            ## Recent changes (prioritize testing these)
            ```
            ${{ steps.commits.outputs.log }}
            ```
