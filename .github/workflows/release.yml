name: Release

on:
  push:
    tags: ['v*']
  # Visual regression can also be triggered manually to refresh or audit
  # baselines without cutting a release.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate visual regression baselines and upload as artifact'
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12 --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  test:
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubicloud-standard-2, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python ${{ matrix.python-version }} --extra dev --extra viewer
      - run: uv run pytest tests/ --cov=src/aegis --cov-report=xml -x
      - name: Upload coverage
        if: matrix.os == 'ubicloud-standard-2' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  schemathesis:
    needs: [lint]
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-2
    # Patch-release tier: catch HTTP-layer regressions (schema drift, 5xx on
    # fuzzed inputs) that PR-tier doesn't afford. Budget ~5 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12 --extra viewer --extra dev
      - name: Start viewer
        run: |
          uv run python -m aegis.viewer --scenario open_ground >/tmp/viewer.log 2>&1 &
          echo $! > /tmp/viewer.pid
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5000/api/openapi.json >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5000/api/openapi.json >/dev/null || {
            echo "viewer failed to start"; tail -80 /tmp/viewer.log; exit 1;
          }
      - name: Schemathesis sweep
        run: |
          # v4 phase and check exclusions explained:
          # - Drop the 'coverage' phase (new in v4): targeted boundary-value fuzz,
          #   aggressive, noisy against our spec maturity. Keep examples+fuzzing+stateful.
          # - unsupported_method: Flask returns 404 not 405 for unregistered verbs.
          # - content_type_conformance: binary (octet-stream) responses aren't always declared.
          # - positive_data_acceptance: OpenAPI spec doesn't mark all required fields yet, so
          #   schemathesis synthesises "empty" payloads that the server rightly rejects with 400.
          uv run schemathesis run http://localhost:5000/api/openapi.json \
            --checks=all \
            --phases=examples,fuzzing,stateful \
            --rate-limit=20/s \
            --max-examples=100 \
            --exclude-checks=negative_data_rejection,ignored_auth,unsupported_method,content_type_conformance,positive_data_acceptance
      - name: Stop viewer
        if: always()
        run: kill "$(cat /tmp/viewer.pid)" 2>/dev/null || true

  mutmut:
    # Minor-release tier only: mutmut on the physics-critical modules runs on
    # ``vX.Y.0`` tags (not patch releases). Report-only, does not block the
    # release. See docs/internal/testing_roadmap.md Phase 4 and Wave 5 Agent I
    # audit (docs/internal/mutation_audit_2026-04-18.md) for the score baseline.
    if: endsWith(github.ref_name, '.0')
    needs: [lint]
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12 --extra dev --extra viewer
      - name: Mutmut — fresnel
        env:
          AEGIS_DATA_DIR: ${{ github.workspace }}/data
        run: |
          bash scripts/run_mutmut.sh fresnel || true
          echo "::group::Fresnel results"
          uv run mutmut results | tee mutmut_results_fresnel.txt
          echo "::endgroup::"
      - name: Mutmut — compliance
        env:
          AEGIS_DATA_DIR: ${{ github.workspace }}/data
        run: |
          bash scripts/run_mutmut.sh compliance || true
          echo "::group::Compliance results"
          uv run mutmut results | tee mutmut_results_compliance.txt
          echo "::endgroup::"
      - name: Mutmut — _parsing
        env:
          AEGIS_DATA_DIR: ${{ github.workspace }}/data
        run: |
          bash scripts/run_mutmut.sh parsing || true
          echo "::group::_parsing results"
          uv run mutmut results | tee mutmut_results_parsing.txt
          echo "::endgroup::"
      - name: Upload mutmut reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results-${{ github.ref_name }}
          path: mutmut_results_*.txt

  visual-regression:
    # Minor-release tier: visual regression against committed HUD baselines.
    # Fires only on vX.Y.0 tags (not patch tags like vX.Y.Z where Z > 0) or
    # via manual workflow_dispatch. Baselines live in
    # `aegis-web/tests/e2e/__snapshots__/`. When `update_snapshots=true` the
    # job uploads regenerated baselines as an artifact instead of failing.
    # Does NOT block the release — `release` only needs lint/test/schemathesis.
    needs: [lint]
    if: github.event_name == 'workflow_dispatch' || endsWith(github.ref_name, '.0')
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aegis-web/package-lock.json
      - name: Install Python deps
        run: uv sync --python 3.12 --extra viewer --extra dev
      - name: Install frontend deps
        working-directory: aegis-web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: aegis-web
        run: npx playwright install --with-deps chromium
      - name: Build frontend and copy to Flask static
        working-directory: aegis-web
        run: npm run build:copy
      - name: Start viewer backend
        run: |
          uv run python -m aegis.viewer --no-open --port 5001 >/tmp/viewer.log 2>&1 &
          echo $! > /tmp/viewer.pid
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5001/api/viewer-config >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5001/api/viewer-config >/dev/null || {
            echo "viewer failed to start"; tail -80 /tmp/viewer.log; exit 1;
          }
      - name: Run visual regression specs
        working-directory: aegis-web
        env:
          AEGIS_E2E_BASE_URL: http://localhost:5001
          CI: 'true'
        run: |
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            npx playwright test tests/e2e/visual-regression.spec.ts --reporter=list --update-snapshots
          else
            npx playwright test tests/e2e/visual-regression.spec.ts --reporter=list
          fi
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-diffs
          path: |
            aegis-web/test-results/
            aegis-web/playwright-report/
          retention-days: 14
      - name: Upload regenerated baselines
        if: inputs.update_snapshots
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-baselines
          path: aegis-web/tests/e2e/__snapshots__/
          retention-days: 30
      - name: Stop viewer
        if: always()
        run: kill "$(cat /tmp/viewer.pid)" 2>/dev/null || true

  release:
    needs: [lint, test, schemathesis]
    # Only create a GitHub release on actual tag pushes, not on
    # workflow_dispatch.
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
