      - type: mastedatabasen
        bbox: [7.9, 15.4, 54.4, 57.9]
        priority: 1
        source_tag: gov:mastedatabasen
      - type: opencellid
        country_code: 238
        bbox: [7.9, 15.4, 54.4, 57.9]
        priority: 3
        source_tag: ocid
    reference: data/basestations/raw/brussels_gov.parquet

  netherlands:
