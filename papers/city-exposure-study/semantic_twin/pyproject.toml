[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-semantic-twin"
version = "0.1.0"
description = "Panorama-driven semantic reconstruction for radio digital twins"
requires-python = ">=3.12"
dependencies = [
  "fast-simplification==0.1.13",
  "mapbox-earcut>=1.0",
  "numpy>=2.0",
  "pillow>=11",
  "scikit-image>=0.24",
  "scipy>=1.14",
  "shapely>=2.0",
]

[project.optional-dependencies]
baseline = [
  "huggingface-hub>=0.34,<1",
  "safetensors>=0.7",
  "torch>=2.7",
  "torchvision>=0.22",
  "transformers>=4.57,<5",
]
test = [
  "embreex>=2.17",
  "matplotlib>=3.10",
  "mitsuba>=3.8,<4",
  "pytest>=8",
  "rtree>=1.4",
  "ruff==0.15.16",
  "sionna-rt>=2.0.1,<3.0",
  "trimesh>=4",
]
raycast = ["embreex>=2.17", "trimesh>=4"]
agent = ["mcp>=1.29,<2"]

[tool.setuptools.packages.find]
# Every subpackage, not just the top level. The explicit list this replaces named
# only "semantic_twin", so propagation was never installed and an editable install
# worked solely because the working directory sits on sys.path.
include = ["semantic_twin*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "local_data: reads ignored study artifacts that are unavailable on a clean checkout",
  "slow: runs a driver end to end on a city mesh, minutes rather than seconds",
]
