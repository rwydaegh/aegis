<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>plaza_run replay</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #14141c; color: #ddd; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  #canvas-container { position: absolute; inset: 0; }
  #hud {
    position: absolute; top: 14px; left: 14px;
    background: rgba(10,10,14,0.85); padding: 14px 18px; border-radius: 8px;
    backdrop-filter: blur(8px); min-width: 280px; max-width: 340px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  #hud h1 { margin: 0 0 8px 0; font-size: 14px; color: #7eb4ff; font-weight: 600; }
  #hud .row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
  #hud .label { color: #888; }
  #hud .val { color: #fff; font-variant-numeric: tabular-nums; }
  #controls {
    position: absolute; bottom: 14px; left: 14px; right: 14px;
    background: rgba(10,10,14,0.85); padding: 12px 16px; border-radius: 8px;
    backdrop-filter: blur(8px); display: flex; gap: 14px; align-items: center;
    border: 1px solid rgba(255,255,255,0.08);
  }
  #controls button {
    background: linear-gradient(135deg,#667eea,#764ba2); color: #fff; border: 0;
    border-radius: 6px; padding: 8px 14px; font-size: 12px; cursor: pointer;
    font-weight: 600; min-width: 64px;
  }
  #controls button:hover { filter: brightness(1.15); }
  #controls select {
    background: #222; color: #ccc; border: 1px solid #444; border-radius: 6px;
    padding: 6px 10px; font-size: 12px;
  }
  #controls input[type=range] { flex: 1; }
  #controls .speed { color: #888; font-size: 11px; }
  #legend {
    position: absolute; top: 14px; right: 14px;
    background: rgba(10,10,14,0.85); padding: 10px 14px; border-radius: 8px;
    backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08);
    font-size: 11px;
  }
  #legend .title { color: #aaa; font-size: 10px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  #legend .gradient {
    width: 18px; height: 140px; display: inline-block; vertical-align: middle;
    background: linear-gradient(to top, #1a1a3a 0%, #2166ac 30%, #f7b34a 70%, #b2182b 100%);
    border-radius: 3px; margin-right: 8px;
  }
  #legend .scale {
    display: inline-block; vertical-align: middle; height: 140px;
    color: #ccc; font-variant-numeric: tabular-nums; font-size: 10px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  #legend .label-bottom { color: #888; font-size: 9px; margin-top: 4px; text-align: center; }
  .tier-pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; margin-right: 4px; }
  .tier-A { background: #b2182b; color: #fff; }
  .tier-B { background: #2166ac; color: #fff; }
  .tier-C { background: #404040; color: #fff; }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="hud">
  <h1>plaza_run replay</h1>
  <div class="row"><span class="label">scenario</span><span class="val" id="hud-scenario">…</span></div>
  <div class="row"><span class="label">slot / time</span><span class="val" id="hud-time">…</span></div>
  <div class="row"><span class="label">precoder</span><span class="val" id="hud-precoder">…</span></div>
  <div class="row"><span class="label">sum-rate</span><span class="val" id="hud-sumrate">…</span></div>
  <div class="row"><span class="label">max P_abs/L</span><span class="val" id="hud-maxratio">…</span></div>
  <div style="margin-top: 8px; font-size: 11px;">
    <span class="tier-pill tier-A">Served (A) ×<span id="cnt-A">0</span></span>
    <span class="tier-pill tier-B">Coop (B) ×<span id="cnt-B">0</span></span>
    <span class="tier-pill tier-C">Bystdr (C) ×<span id="cnt-C">0</span></span>

    <div class="scale">
      <span>1e0</span><span>1e-2</span><span>1e-4</span><span>1e-6</span>

</div>

<div id="controls">
  <button id="play-btn">Play</button>
  <input id="time-slider" type="range" min="0" max="100" value="0" />
  <select id="precoder-select"></select>
  <span class="speed">speed
    <select id="speed-select">
      <option value="0.5">0.5x</option>
      <option value="1.0" selected>1x</option>
      <option value="2.0">2x</option>
      <option value="5.0">5x</option>
    </select>
  </span>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TIER_COLORS = { 0: 0xb2182b, 1: 0x2166ac, 2: 0x404040 };
const TIER_NAMES = { 0: 'A', 1: 'B', 2: 'C' };

// Color mapping for log-scale p_abs/L_RL:
//   ratio < 1e-6 → dark blue
//   1e-6..1e-4   → blue
//   1e-4..1e-2   → orange
//   1e-2..1.0    → red
//   >= 1.0       → bright red
function ratioColor(ratio) {
  const r = Math.max(ratio, 1e-9);
  const t = Math.max(0, Math.min(1, (Math.log10(r) + 6) / 6)); // -6..0 -> 0..1
  if (t < 0.3) return new THREE.Color(0x1a1a3a).lerp(new THREE.Color(0x2166ac), t / 0.3);
  if (t < 0.7) return new THREE.Color(0x2166ac).lerp(new THREE.Color(0xf7b34a), (t - 0.3) / 0.4);
  return new THREE.Color(0xf7b34a).lerp(new THREE.Color(0xb2182b), (t - 0.7) / 0.3);
}

let scene, camera, renderer, controls;
let bodies = [];           // { mesh, tier, idx }
let rtPaths = [];          // [{ bodyIdx, lines: { los, ground, facadePlus, facadeMinus } }]
let bsMesh, bsArrow, beamGroup;
let data;                  // unpacked replay payload
let playing = false, currentFrame = 0, lastTickMs = performance.now(), speed = 1.0;
let activePrecoderIdx = 0;

async function main() {
  const resp = await fetch('replay_data.json');
  data = await resp.json();
  unpackArrays();
  // Fetch posed-mesh binary if the sidecar pointer is present.
  if (data.meshes_sidecar) {
    try {
      await fetchPosedMeshes(data.meshes_sidecar.bin_path);
      console.log('posed mesh data loaded:', data.posedMesh.K, 'KF x', data.posedMesh.B, 'bodies, V=' + data.posedMesh.V + ' F=' + data.posedMesh.F);
      window.__replayDebug = { data, bodies, scene: null };
    } catch (err) {
      console.warn('posed-mesh fetch failed; falling back to capsules:', err);
      data.posedMesh = null;
    }
  }
  setupScene();
  buildScene();
  populateUI();
  animate();
}

async function fetchPosedMeshes(binPath) {
  const resp = await fetch(binPath);
  if (!resp.ok) throw new Error('mesh fetch ' + resp.status);
  const buf = await resp.arrayBuffer();
  const hdr = new Uint32Array(buf, 0, 8);
  const [magic, version, K, B, V, F, kfPeriod] = hdr;
  if (magic !== 0x504C5A4D) throw new Error('bad magic in mesh blob');
  if (version !== 3) throw new Error('mesh version ' + version + ' unsupported (expected 3)');
  // Layout after 32-byte header:
  //   [F*3 uint32]              face indices (shared topology)
  //   [K*B*V*3 float32]         body-local verts
  //   [K*B float32]             per-keyframe heading (radians)
  //   [K*B*2 float32]           per-keyframe world xy
  const facesByteLen = F * 3 * 4;
  const vertsByteLen = K * B * V * 3 * 4;
  const headingsByteLen = K * B * 4;
  const faces = new Uint32Array(buf, 32, F * 3);
  const verts = new Float32Array(buf, 32 + facesByteLen, K * B * V * 3);
  const headings = new Float32Array(buf, 32 + facesByteLen + vertsByteLen, K * B);
  const worldXY = new Float32Array(buf, 32 + facesByteLen + vertsByteLen + headingsByteLen, K * B * 2);
  data.posedMesh = {
    K, B, V, F, kfPeriod, faces, verts, headings, worldXY,
    stride_per_body: V * 3,
  };
}

function unpackArrays() {
  const fr = data.frames;
  const [T, B, _] = fr.body_xy_shape;
  const [Tp, Bp, P] = fr.p_abs_shape;
  fr.body_xy = new Float32Array(fr.body_xy_flat);
  fr.p_abs   = new Float32Array(fr.p_abs_flat);
  fr.sumrate = new Float32Array(fr.sumrate_flat);
  delete fr.body_xy_flat; delete fr.p_abs_flat; delete fr.sumrate_flat;
  data.frames.T = T; data.frames.B = B; data.frames.P = P;
}

function setupScene() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  window.__replayDebug = window.__replayDebug || {};
  window.__replayDebug.scene = scene;
  window.__replayDebug.getCamera = () => camera;
  window.__replayDebug.getRenderer = () => renderer;
  scene.background = new THREE.Color(0x14141c);
  scene.fog = new THREE.Fog(0x14141c, 80, 220);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 600);
  camera.position.set(0, -90, 70);
  camera.up.set(0, 0, 1);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.target.set(0, 0, 4);
  controls.update();
  // Expose for debugging / Playwright camera control
  window.__camera = camera;
  window.__controls = controls;

  // Lighting — brightened so bodies aren't lost in building shadows.
  scene.add(new THREE.AmbientLight(0x6677aa, 1.1));
  const sun = new THREE.DirectionalLight(0xfff5e6, 1.6);
  sun.position.set(40, 60, 120);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -80;
  sun.shadow.camera.right = 80;
  sun.shadow.camera.top = 80;
  sun.shadow.camera.bottom = -80;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 300;
  sun.shadow.bias = -0.001;
  scene.add(sun);
  const fill = new THREE.HemisphereLight(0xaabbdd, 0x665544, 0.7);
  scene.add(fill);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function buildScene() {
  // Ground
  const g = data.ground;
  const groundMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(g.size[0], g.size[1]),
    new THREE.MeshStandardMaterial({ color: 0x4a4a50, roughness: 0.92 })
  );
  groundMesh.rotation.x = 0; // already in z=0 plane
  groundMesh.position.z = g.z;
  groundMesh.receiveShadow = true;
  scene.add(groundMesh);

  // Buildings: prefer real OSM mesh if present, else synthetic boxes.
  const buildingMat = new THREE.MeshStandardMaterial({
    color: 0x8a8a98, roughness: 0.78, metalness: 0.05, side: THREE.DoubleSide
  });
  if (data.osm_mesh) {
    const verts = new Float32Array(data.osm_mesh.vertices_flat);
    const tris = new Uint32Array(data.osm_mesh.triangles_flat);
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geom.setIndex(new THREE.BufferAttribute(tris, 1));
    geom.computeVertexNormals();
    const osmMesh = new THREE.Mesh(geom, buildingMat);
    osmMesh.castShadow = true;
    osmMesh.receiveShadow = true;
    scene.add(osmMesh);
  } else {
    for (const b of data.buildings) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(b.size[0], b.size[1], b.size[2]), buildingMat);
      m.position.set(b.center[0], b.center[1], b.center[2]);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
    }
  }

  // BS panel — visible 8x8 grid of dots on a backplane
  const bs = data.bs;
  const PANEL_W = 1.6, PANEL_H = 1.6, PANEL_D = 0.18;
  const bsBack = new THREE.Mesh(
    new THREE.BoxGeometry(PANEL_W, PANEL_D, PANEL_H),
    new THREE.MeshStandardMaterial({ color: 0x202028, roughness: 0.3, metalness: 0.4 })
  );
  bsBack.position.set(bs.position[0], bs.position[1], bs.position[2]);
  bsBack.castShadow = true;
  scene.add(bsBack);
  // 8x8 element dots on the front face (facing +y broadside-ish)
  const dotGeo = new THREE.SphereGeometry(0.05, 8, 8);
  const dotMat = new THREE.MeshStandardMaterial({
    color: 0xff5533, emissive: 0xff3322, emissiveIntensity: 1.2
  });
  for (let h = 0; h < bs.n_h; h++) {
    for (let v = 0; v < bs.n_v; v++) {
      const dx = (h - 3.5) * 0.18;
      const dz = (v - 3.5) * 0.18;
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.position.set(bs.position[0] + dx, bs.position[1] + PANEL_D / 2 + 0.01, bs.position[2] + dz);
      scene.add(dot);
    }
  }
  bsMesh = bsBack;
  // Pole
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.08, bs.position[2], 12),
    new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 })
  );
  pole.position.set(bs.position[0], bs.position[1], bs.position[2] / 2);
  pole.rotation.x = Math.PI / 2;
  pole.castShadow = true;
  scene.add(pole);
  // Broadside arrow (longer, brighter)
  bsArrow = new THREE.ArrowHelper(
    new THREE.Vector3(...bs.broadside).normalize(),
    new THREE.Vector3(...bs.position),
    14, 0xffcc44, 2.4, 1.4
  );
  scene.add(bsArrow);
  // BS label sprite
  const labelCanvas = document.createElement('canvas');
  labelCanvas.width = 256; labelCanvas.height = 64;
  const ctx = labelCanvas.getContext('2d');
  ctx.fillStyle = 'rgba(20,20,28,0.9)'; ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = '#ffcc44'; ctx.font = 'bold 26px sans-serif';
  ctx.fillText('BS  8x8 @ 26 GHz', 14, 42);
  const labelTex = new THREE.CanvasTexture(labelCanvas);
  const labelMat = new THREE.SpriteMaterial({ map: labelTex });
  const labelSprite = new THREE.Sprite(labelMat);
  labelSprite.position.set(bs.position[0], bs.position[1], bs.position[2] + 2.0);
  labelSprite.scale.set(6, 1.5, 1);
  scene.add(labelSprite);

  // If posed-mesh binary is loaded, render real SMPL-X meshes per body.
  // Else fall back to the rigged-capsule person.
  if (data.posedMesh) {
    buildPosedBodies();
  } else {
    buildRiggedBodies();
  }
  buildSceneCommon();
}

function buildSceneCommon() {
  // Compass / origin
  const axes = new THREE.AxesHelper(5);
  axes.position.set(0, 0, 0.05);
  scene.add(axes);

  // RT path bundle per served user: LOS (BS→UE) + ground bounce + 2 facade
  // bounces, mirroring plaza_specular_paths::_reflect_point. Each path is
  // a polyline whose vertices are updated each frame.
  beamGroup = new THREE.Group();
  scene.add(beamGroup);
  const PATH_COLORS = {
    los: 0xffd966,         // bright amber for LOS
    ground: 0x8ab9ff,      // cool blue for ground bounce
    facadePlus: 0xff8b6e,  // coral for north facade
    facadeMinus: 0xc999ff, // lavender for south facade
  };
  const PATH_OPACITIES = {
    los: 0.55, ground: 0.30, facadePlus: 0.30, facadeMinus: 0.30,
  };
  rtPaths = [];
  for (let i = 0; i < data.tier.length; i++) {
    if (data.tier[i] !== 0) continue;
    const userPaths = { bodyIdx: i, lines: {} };
    for (const [pname, color] of Object.entries(PATH_COLORS)) {
      const npts = (pname === 'los') ? 2 : 3;
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(npts * 3), 3));
      const mat = new THREE.LineBasicMaterial({
        color, transparent: true, opacity: PATH_OPACITIES[pname],
      });
      const line = new THREE.Line(geom, mat);
      line.userData.pathName = pname;
      beamGroup.add(line);
      userPaths.lines[pname] = line;
    }
    rtPaths.push(userPaths);
  }
  window.__replayDebug.rtPaths = rtPaths;
}

// Reflection-point helper using image method, matching paths.py::_reflect_point.
// Returns { x, y, z } where the BS→UE specular ray hits the plane.
function _reflectionPoint(bsX, bsY, bsZ, ueX, ueY, ueZ, planeNx, planeNy, planeNz, planePx, planePy, planePz) {
  const d = (bsX - planePx) * planeNx + (bsY - planePy) * planeNy + (bsZ - planePz) * planeNz;
  const imgX = bsX - 2 * d * planeNx;
  const imgY = bsY - 2 * d * planeNy;
  const imgZ = bsZ - 2 * d * planeNz;
  const rx = ueX - imgX, ry = ueY - imgY, rz = ueZ - imgZ;
  const denom = rx * planeNx + ry * planeNy + rz * planeNz;
  if (Math.abs(denom) < 1e-9) return null;
  const t = ((planePx - imgX) * planeNx + (planePy - imgY) * planeNy + (planePz - imgZ) * planeNz) / denom;
  return { x: imgX + t * rx, y: imgY + t * ry, z: imgZ + t * rz };
}

// Plaza geometry constants, matching paths.py::FACADE_Y_M.
const PLAZA_FACADE_Y_M = 35.0;

function buildPosedBodies() {
  const pm = data.posedMesh;
  const V = pm.V;
  // Indexed geometry: same face buffer reused across all bodies.
  const indexAttr = new THREE.BufferAttribute(pm.faces, 1);
  for (let i = 0; i < pm.B; i++) {
    const tier = data.tier[i];
    const positions = new Float32Array(V * 3);
    // init body-local verts from keyframe 0 slab (already at root xy=0, feet z=0).
    const src = pm.verts.subarray(i * pm.stride_per_body, (i + 1) * pm.stride_per_body);
    positions.set(src);
    const colors = new Float32Array(V * 3);
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geom.setIndex(indexAttr);
    geom.computeVertexNormals();
    // MeshBasicMaterial (unlit): vertex colors render directly so the
    // per-vertex APD heatmap is visible without ambient/directional washout.
    // The relu(n·k_BS) modulation in updatePosedBody provides its own
    // shape-revealing shading.
    const mat = new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: false,
    });
    const m = new THREE.Mesh(geom, mat);
    scene.add(m);
    bodies.push({
      mesh: m, mat, tier, idx: i, posed: true,
      geom, positions, colors,
      lastPos: new THREE.Vector2(0, 0),
      lastKfBlend: -1,  // last (kfA, blend) tuple to avoid redundant rebuilds
      blend: 0.0,
    });
  }
}

function buildRiggedBodies() {
  // Rigged person: torso + head + 2 arms + 2 legs + smartphone at right hand.
  // Each body's limbs animate with a sinusoidal gait so the walk reads visually.
  // The phone bobbing IS the virtual IMU signal we'd consume in the precoder.
  const torsoGeo = new THREE.CapsuleGeometry(0.16, 0.40, 4, 10);
  const armGeo = new THREE.CapsuleGeometry(0.055, 0.45, 4, 8);
  const legGeo = new THREE.CapsuleGeometry(0.075, 0.75, 4, 8);
  const headGeo = new THREE.SphereGeometry(0.13, 14, 12);
  const phoneGeo = new THREE.BoxGeometry(0.07, 0.13, 0.012);
  const phoneMat = new THREE.MeshStandardMaterial({
    color: 0x111111, emissive: 0x88aaff, emissiveIntensity: 0.45, roughness: 0.4
  });

  for (let i = 0; i < data.tier.length; i++) {
    const tier = data.tier[i];
    const tierColor = TIER_COLORS[tier];
    const mat = new THREE.MeshStandardMaterial({
      color: tierColor, roughness: 0.55, emissive: 0x000000, emissiveIntensity: 0.4
    });
    const skinMat = new THREE.MeshStandardMaterial({
      color: 0xeec3a0, roughness: 0.7, emissive: 0x000000, emissiveIntensity: 0.0
    });

    const root = new THREE.Group();
    // Torso
    const torso = new THREE.Mesh(torsoGeo, mat);
    torso.rotation.x = Math.PI / 2;
    torso.position.z = 1.10;
    torso.castShadow = true;
    root.add(torso);
    // Head
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.z = 1.55;
    head.castShadow = true;
    root.add(head);
    // Arms
    const armLPivot = new THREE.Group();
    armLPivot.position.set(-0.20, 0, 1.30);
    const armL = new THREE.Mesh(armGeo, mat);
    armL.rotation.x = Math.PI / 2;
    armL.position.z = -0.25;
    armL.castShadow = true;
    armLPivot.add(armL);
    root.add(armLPivot);
    const armRPivot = new THREE.Group();
    armRPivot.position.set(0.20, 0, 1.30);
    const armR = new THREE.Mesh(armGeo, mat);
    armR.rotation.x = Math.PI / 2;
    armR.position.z = -0.25;
    armR.castShadow = true;
    armRPivot.add(armR);
    root.add(armRPivot);
    // Phone in right hand: child of armR end
    const phone = new THREE.Mesh(phoneGeo, phoneMat);
    phone.position.set(0, 0, -0.50);  // tip of right arm
    phone.rotation.x = Math.PI / 2;
    armRPivot.add(phone);
    // Legs
    const legLPivot = new THREE.Group();
    legLPivot.position.set(-0.10, 0, 0.92);
    const legL = new THREE.Mesh(legGeo, mat);
    legL.rotation.x = Math.PI / 2;
    legL.position.z = -0.40;
    legL.castShadow = true;
    legLPivot.add(legL);
    root.add(legLPivot);
    const legRPivot = new THREE.Group();
    legRPivot.position.set(0.10, 0, 0.92);
    const legR = new THREE.Mesh(legGeo, mat);
    legR.rotation.x = Math.PI / 2;
    legR.position.z = -0.40;
    legR.castShadow = true;
    legRPivot.add(legR);
    root.add(legRPivot);

    scene.add(root);
    bodies.push({
      mesh: root, mat, tier, idx: i,
      pivots: { armL: armLPivot, armR: armRPivot, legL: legLPivot, legR: legRPivot },
      torso, head, phone,
      gaitPhase: (i * 1.7) % (2 * Math.PI),  // de-synced
      lastPos: new THREE.Vector2(0, 0),
    });
  }
}

function populateUI() {
  const sel = document.getElementById('precoder-select');
  data.precoder_names.forEach((p, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.text = p;
    if (p === 'multibody_ecbf') o.selected = true;
    sel.appendChild(o);
  });
  activePrecoderIdx = parseInt(sel.value, 10);
  sel.addEventListener('change', () => { activePrecoderIdx = parseInt(sel.value, 10); updateFrame(currentFrame); });

  const slider = document.getElementById('time-slider');
  slider.max = data.frames.T - 1;
  slider.addEventListener('input', () => { currentFrame = parseInt(slider.value, 10); updateFrame(currentFrame); });

  const playBtn = document.getElementById('play-btn');
  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.textContent = playing ? 'Pause' : 'Play';
    lastTickMs = performance.now();
  });

  document.getElementById('speed-select').addEventListener('change', (e) => {
    speed = parseFloat(e.target.value);
  });

  // Tier counts
  let cnt = { 0: 0, 1: 0, 2: 0 };
  for (const t of data.tier) cnt[t]++;
  document.getElementById('cnt-A').textContent = cnt[0];
  document.getElementById('cnt-B').textContent = cnt[1];
  document.getElementById('cnt-C').textContent = cnt[2];

  document.getElementById('hud-scenario').textContent =
    `${data.scenario.paths_mode} / pose=${data.scenario.pose_mode} / ${data.scenario.freq_hz/1e9} GHz`;

  // Default to a mid-trace frame so the page doesn't open on the cold-start
  // transient where channel sumrate is ~0. Keyframe 15 = slot 75 is well past
  // the first pose-cadence rebuild.
  currentFrame = 15;
  updateFrame(currentFrame);
}

// Tmp scratch vectors so we don't allocate inside the hot loop.
const _v = { a: new THREE.Vector3(), b: new THREE.Vector3(), c: new THREE.Vector3(),
             ab: new THREE.Vector3(), ac: new THREE.Vector3(), n: new THREE.Vector3(),
             cen: new THREE.Vector3(), kHat: new THREE.Vector3(), bsP: new THREE.Vector3() };

// Tmp scratch.
const _vTmpA = new Float32Array(3);
const _vTmpB = new Float32Array(3);

function updatePosedBody(body, i, pmKf, blend, worldX, worldY, heading, bs, ratioCol) {
  const pm = data.posedMesh;
  const V = pm.V;
  const stride = pm.stride_per_body;
  // Lerp body-local verts between keyframe a (=pmKf) and b (=pmKf+1) by `blend`.
  // This smooths the gait so it doesn't freeze for kp slots between keyframes.
  const aOff = (pmKf * pm.B + i) * stride;
  const bKf = Math.min(pmKf + 1, pm.K - 1);
  const bOff = (bKf * pm.B + i) * stride;
  const a = pm.verts;
  const positions = body.positions;
  // Only rebuild verts if (kf, blend) changed enough — vertex lerp is the
  // expensive step at 50 bodies × 757 verts × 30 fps.
  const blendQ = pmKf * 100 + Math.floor(blend * 32);  // quantised key
  if (blendQ !== body.lastKfBlend) {
    if (blend < 1e-3) {
      for (let k = 0; k < stride; k++) positions[k] = a[aOff + k];
    } else {
      const u = 1.0 - blend, w = blend;
      for (let k = 0; k < stride; k++) positions[k] = a[aOff + k] * u + a[bOff + k] * w;
    }
    body.geom.attributes.position.needsUpdate = true;
    body.geom.computeVertexNormals();
    body.geom.attributes.normal.needsUpdate = true;
    body.lastKfBlend = blendQ;
  }

  // Hide bodies that haven't entered the plaza yet (parked at off-camera xy).
  const insidePlaza = Math.hypot(worldX, worldY) < 50.0;
  body.mesh.visible = insidePlaza;
  if (!insidePlaza) return;

  // Place + rotate the mesh. Translation drives the global walk velocity,
  // rotation matches direction of motion (heading). SMPL-X canonical pose
  // with global_orient=(π/2,0,0) faces -Y (the original body's +Z forward
  // axis maps to -Y under R_x(π/2)), so we add π/2 to align -Y with the
  // heading direction.
  body.mesh.position.set(worldX, worldY, 0.0);
  body.mesh.rotation.z = heading + Math.PI / 2;

  // Per-vertex APD = max(0, n_hat · k_BS) modulated by per-body p_abs.
  // The geometry's vertex normals are in body-local; transform to world by
  // applying the same z-rotation we set on the mesh.
  const normals = body.geom.attributes.normal.array;
  const colors = body.colors;
  const cosH = Math.cos(body.mesh.rotation.z), sinH = Math.sin(body.mesh.rotation.z);
  let peak = 0.0;
  const reluPerVert = body.reluTmp || (body.reluTmp = new Float32Array(V));
  const bsx = bs[0], bsy = bs[1], bsz = bs[2];
  for (let v = 0; v < V; v++) {
    const lx = positions[v * 3 + 0], ly = positions[v * 3 + 1], lz = positions[v * 3 + 2];
    // World-frame vertex
    const wx = cosH * lx - sinH * ly + worldX;
    const wy = sinH * lx + cosH * ly + worldY;
    const wz = lz;
    // World-frame normal
    const nlx = normals[v * 3 + 0], nly = normals[v * 3 + 1], nlz = normals[v * 3 + 2];
    const nwx = cosH * nlx - sinH * nly;
    const nwy = sinH * nlx + cosH * nly;
    const nwz = nlz;
    // Direction from vertex to BS
    const dxBS = bsx - wx, dyBS = bsy - wy, dzBS = bsz - wz;
    const dl = Math.hypot(dxBS, dyBS, dzBS);
    if (dl < 1e-9) {
      reluPerVert[v] = 0;
      continue;
    }
    const dot = (nwx * dxBS + nwy * dyBS + nwz * dzBS) / dl;
    const r = Math.max(0, dot);
    reluPerVert[v] = r;
    if (r > peak) peak = r;
  }
  // Heatmap: per-body individually-normalized cold→warm ramp on relu(n·k_BS).
  // Slack-regime bodies all have ratio≪1, so encoding ratio in the body's
  // global hue (the previous design) collapsed to a uniform dark blue and
  // the per-vertex shape silhouette disappeared. Now every body gets the
  // full cold→warm range based on its own peak relu, so the BS-facing
  // shape always reads. Per-body ratio is still surfaced via the HUD's
  // `max P_abs/L` row.
  const denom = peak > 1e-6 ? peak : 1.0;
  for (let v = 0; v < V; v++) {
    const tv = Math.max(0.0, Math.min(1.0, reluPerVert[v] / denom));
    // Smoothstep so the front and back regions hold their colour and the
    // transition lives in the limb tangent plane (a thin band).
    const ts = tv * tv * (3.0 - 2.0 * tv);
    // 4-stop ramp: navy → blue → orange → red.
    let r, g, b;
    if (ts < 0.40) {
      const u = ts / 0.40;
      r = 0.10 + 0.05 * u;
      g = 0.10 + 0.30 * u;
      b = 0.30 + 0.40 * u;
    } else if (ts < 0.75) {
      const u = (ts - 0.40) / 0.35;
      r = 0.15 + 0.70 * u;
      g = 0.40 + 0.30 * u;
      b = 0.70 - 0.50 * u;
    } else {
      const u = (ts - 0.75) / 0.25;
      r = 0.85 + 0.05 * u;
      g = 0.70 - 0.50 * u;
      b = 0.20 - 0.05 * u;
    }
    colors[v * 3 + 0] = r;
    colors[v * 3 + 1] = g;
    colors[v * 3 + 2] = b;
  }
  body.geom.attributes.color.needsUpdate = true;
}


function updateFrame(t) {
  const fr = data.frames;
  const B = fr.B, P = fr.P;
  const bs = data.bs.position;
  let maxRatio = 0;
  // Map replay-data keyframe t (decim_t = 5 slots) → posed-mesh keyframe a, b
  // and a blend factor in [0, 1] for smooth interpolation between them.
  let pmKfA = -1, pmKfBlend = 0.0;
  if (data.posedMesh) {
    const slot = data.frames.t_keep[t];
    const kp = data.meshes_sidecar.keyframe_period;
    const fk = slot / kp;
    pmKfA = Math.min(data.posedMesh.K - 1, Math.floor(fk));
    pmKfBlend = Math.max(0, Math.min(1, fk - pmKfA));
  }
  for (let i = 0; i < B; i++) {
    const x = fr.body_xy[(t * B + i) * 2 + 0];
    const y = fr.body_xy[(t * B + i) * 2 + 1];
    const body = bodies[i];
    const pAbs = fr.p_abs[(t * B + i) * P + activePrecoderIdx];
    const budget = data.body_budgets_w[i];
    const ratio = pAbs / budget;
    maxRatio = Math.max(maxRatio, ratio);
    const c = ratioColor(ratio);

    if (body.posed) {
      // Heading from sidecar table at keyframe A. The export computes it from
      // forward-difference velocity and damps Brownian noise.
      const pm = data.posedMesh;
      const heading = pm.headings[pmKfA * pm.B + i];
      updatePosedBody(body, i, pmKfA, pmKfBlend, x, y, heading, bs, c);
    } else {
      // Heading: face direction we moved
      const dx = x - body.lastPos.x, dy = y - body.lastPos.y;
      if (Math.hypot(dx, dy) > 1e-3) {
        body.mesh.rotation.z = Math.atan2(dy, dx) - Math.PI / 2;
      }
      body.mesh.position.x = x;
      body.mesh.position.y = y;
      body.mesh.position.z = 0;
      body.mat.color.copy(c);
      body.mat.emissive.copy(c).multiplyScalar(0.4);
    }
    body.lastPos.set(x, y);
  }
  // Update RT path bundles per served user. Hide all paths if the body
  // is parked off-camera (xy magnitude > 50 m).
  if (rtPaths.length) {
    const ueZ = 1.5;
    const bsX = bs[0], bsY = bs[1], bsZ = bs[2];
    for (const userPaths of rtPaths) {
      const idx = userPaths.bodyIdx;
      const x = bodies[idx].lastPos.x;
      const y = bodies[idx].lastPos.y;
      const offCam = Math.hypot(x, y) > 50.0;
      // LOS
      {
        const line = userPaths.lines.los;
        line.visible = !offCam;
        const pos = line.geometry.attributes.position;
        pos.setXYZ(0, bsX, bsY, bsZ);
        pos.setXYZ(1, x, y, ueZ);
        pos.needsUpdate = true;
      }
      // Ground bounce: plane normal +z, point (0,0,0)
      {
        const r = _reflectionPoint(bsX, bsY, bsZ, x, y, ueZ, 0, 0, 1, 0, 0, 0);
        const line = userPaths.lines.ground;
        line.visible = !offCam && !!r;
        if (r) {
          const pos = line.geometry.attributes.position;
          pos.setXYZ(0, bsX, bsY, bsZ);
          pos.setXYZ(1, r.x, r.y, r.z);
          pos.setXYZ(2, x, y, ueZ);
          pos.needsUpdate = true;
        }
      }
      // North facade y=+FACADE_Y, normal -y
      {
        const r = _reflectionPoint(bsX, bsY, bsZ, x, y, ueZ, 0, -1, 0, 0, PLAZA_FACADE_Y_M, 0);
        const line = userPaths.lines.facadePlus;
        line.visible = !offCam && !!r;
        if (r) {
          const pos = line.geometry.attributes.position;
          pos.setXYZ(0, bsX, bsY, bsZ);
          pos.setXYZ(1, r.x, r.y, r.z);
          pos.setXYZ(2, x, y, ueZ);
          pos.needsUpdate = true;
        }
      }
      // South facade y=-FACADE_Y, normal +y
      {
        const r = _reflectionPoint(bsX, bsY, bsZ, x, y, ueZ, 0, 1, 0, 0, -PLAZA_FACADE_Y_M, 0);
        const line = userPaths.lines.facadeMinus;
        line.visible = !offCam && !!r;
        if (r) {
          const pos = line.geometry.attributes.position;
          pos.setXYZ(0, bsX, bsY, bsZ);
          pos.setXYZ(1, r.x, r.y, r.z);
          pos.setXYZ(2, x, y, ueZ);
          pos.needsUpdate = true;
        }
      }
    }
  }
  // Update HUD
  const slot = data.frames.t_keep[t];
  const ts = (slot * data.scenario.dt_s).toFixed(2);
  document.getElementById('hud-time').textContent = `${slot} / ${data.scenario.n_slots_full}  (${ts} s)`;
  document.getElementById('hud-precoder').textContent = data.precoder_names[activePrecoderIdx];
  const sr = fr.sumrate[t * P + activePrecoderIdx] / 1e6;
  document.getElementById('hud-sumrate').textContent = `${sr.toFixed(1)} Mbps`;
  document.getElementById('hud-maxratio').textContent = maxRatio.toExponential(2);
  document.getElementById('time-slider').value = t;
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - lastTickMs) / 1000;
  // Drive the gait every render frame for the rigged-capsule fallback.
  // Posed bodies get their motion from the SMPL-X mesh data directly.
  const gaitOmega = 2 * Math.PI * 1.5;  // 1.5 Hz gait, both legs
  for (const body of bodies) {
    if (body.posed) continue;
    body.gaitPhase += gaitOmega * Math.min(0.05, dt);
    const phase = body.gaitPhase;
    const swing = Math.sin(phase);
    const counter = Math.sin(phase + Math.PI);
    body.pivots.legL.rotation.x = swing * 0.55;
    body.pivots.legR.rotation.x = counter * 0.55;
    body.pivots.armL.rotation.x = counter * 0.45;
    body.pivots.armR.rotation.x = swing * 0.45;
    // Vertical bob from the gait — phone follows because it's a child of armR.
    body.mesh.position.z = 0 + Math.abs(Math.sin(phase * 2)) * 0.04;
  }
  if (playing) {
    // Each keyframe represents decim_t real slots. Replay at speed * 30 keyframes/s.
    const advance = speed * 30 * dt;
    if (advance >= 1.0) {
      currentFrame = Math.floor(currentFrame + advance) % data.frames.T;
      updateFrame(currentFrame);
      lastTickMs = now;
    }
  } else {
    lastTickMs = now;
  }
  controls.update();
  renderer.render(scene, camera);
}

main().catch(e => { console.error(e); document.body.innerHTML = '<pre style="color:red;padding:20px">' + e + '</pre>'; });
</script>
