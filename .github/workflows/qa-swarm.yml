name: QA swarm

on:
  workflow_dispatch: {}   # Manual trigger only

jobs:
  # Manager: analyzes recent changes and feature surface, assigns 5 non-overlapping scopes
  manager:
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      id-token: write
    outputs:
      assignments: ${{ steps.extract.outputs.assignments }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get recent commits
        id: commits
        run: |
          RECENT=$(git log --oneline --since="3 days ago" --no-merges -100)
          if [ -z "$RECENT" ]; then
            RECENT=$(git log --oneline -30 --no-merges)
          fi
          {
            echo "log<<COMMITS_EOF"
            echo "$RECENT"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Load prompt
        id: load_prompt
        run: |
          {
            echo "content<<PROMPT_EOF"
            cat agent_hq/prompts/qa-swarm-manager.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/aegis-overview.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Plan QA assignments
        id: plan
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-7 --allowedTools "Edit,Read,Write,Glob,Grep,Bash(*),WebSearch,WebFetch,Agent"'
          prompt: |
            ${{ steps.load_prompt.outputs.content }}

            ## Recent commits
            ```
            ${{ steps.commits.outputs.log }}
            ```

      - name: Extract assignments JSON
        id: extract
        run: |
          # Read Claude's response from the execution output file
          EXEC_FILE="${{ steps.plan.outputs.execution_file }}"
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::Claude execution file not found at: $EXEC_FILE"
            ASSIGNMENTS=""
          else
            echo "Execution file: $EXEC_FILE ($(wc -c < "$EXEC_FILE") bytes)"
            # The execution file is JSON. Extract ASSIGNMENTS_JSON from any string value.
            cat > /tmp/extract_assignments.py << 'PYEOF'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          def walk(obj):
              if isinstance(obj, str):
                  m = re.search(r'ASSIGNMENTS_JSON:(\{.*\})', obj)
                  if m:
                      try:
                          json.loads(m.group(1))
                          return m.group(1)
                      except json.JSONDecodeError:
                          pass
              elif isinstance(obj, list):
                  for item in reversed(obj):
                      r = walk(item)
                      if r: return r
              elif isinstance(obj, dict):
                  for v in obj.values():
                      r = walk(v)
                      if r: return r
              return None
          result = walk(data)
          if result:
              print(result)
          PYEOF
            ASSIGNMENTS=$(python3 /tmp/extract_assignments.py "$EXEC_FILE" 2>/dev/null || true)
            echo "Extracted assignments length: ${#ASSIGNMENTS}"
          fi
          if [ -z "$ASSIGNMENTS" ]; then
            echo "::error::Manager did not produce ASSIGNMENTS_JSON output"
            # Fallback: static assignment
            ASSIGNMENTS='{"testers":[{"id":1,"focus":"Antenna and phantom controls","instructions":"Test antenna placement, nudging with arrow keys, deletion. Test phantom rotation with Q/E, phantom selection."},{"id":2,"focus":"Dosimetry and compliance","instructions":"Test HUD values, compliance display, quantity selector, units. Check values after placing antenna and changing parameters."},{"id":3,"focus":"Parameters and modes","instructions":"Test frequency bands, power settings, ray tracing toggle, stochastic propagation, MIMO mode."},{"id":4,"focus":"Panels and UI","instructions":"Test all sidebar panels, layers visibility, export panel, base station panel, tissue settings."},{"id":5,"focus":"Scene and display","instructions":"Test scene loading, camera controls, viewpoints, display modes, color scales, legend, voxel tiles."}]}'
          fi
          echo "assignments=$ASSIGNMENTS" >> "$GITHUB_OUTPUT"

  # Fan out: 5 parallel QA testers, each with their specific assignment
  tester:
    needs: manager
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    strategy:
      matrix:
        tester_id: [1, 2, 3, 4, 5]
      fail-fast: false  # Don't cancel other testers if one fails
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get recent commits
        id: commits
        run: |
          RECENT=$(git log --oneline --since="3 days ago" --no-merges -50)
          if [ -z "$RECENT" ]; then
            RECENT=$(git log --oneline -20 --no-merges)
          fi
          {
            echo "log<<COMMITS_EOF"
            echo "$RECENT"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract my assignment
        id: assignment
        env:
          ALL_ASSIGNMENTS: ${{ needs.manager.outputs.assignments }}
        run: |
          TESTER_ID=${{ matrix.tester_id }}
          FOCUS=$(echo "$ALL_ASSIGNMENTS" | jq -r ".testers[] | select(.id == $TESTER_ID) | .focus")
          INSTRUCTIONS=$(echo "$ALL_ASSIGNMENTS" | jq -r ".testers[] | select(.id == $TESTER_ID) | .instructions")
          {
            echo "focus<<FOCUS_EOF"
            echo "$FOCUS"
            echo "FOCUS_EOF"
            echo "instructions<<INST_EOF"
            echo "$INSTRUCTIONS"
            echo "INST_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Load prompt
        id: load_prompt
        run: |
          {
            echo "content<<PROMPT_EOF"
            cat agent_hq/prompts/qa-tester.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/aegis-overview.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/not-bugs.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run QA tester
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-7 --allowedTools "Edit,Read,Write,Glob,Grep,Bash(*),WebSearch,WebFetch,Agent"'
          prompt: |
            ${{ steps.load_prompt.outputs.content }}

            ## Your starting area

            **${{ steps.assignment.outputs.focus }}**

            ${{ steps.assignment.outputs.instructions }}

            ## Recent changes
            ```
            ${{ steps.commits.outputs.log }}
            ```

            ## Issue template

            When filing issues, include these details:
            - **Focus area:** ${{ steps.assignment.outputs.focus }}
            - **Tester:** #${{ matrix.tester_id }} of 5 (swarm run)

            End issue body with:
            `---`
            `*Filed by [`qa-swarm.yml`](https://github.com/rwydaegh/aegis/actions/workflows/qa-swarm.yml) tester #${{ matrix.tester_id }} · run [${{ github.run_id }}](https://github.com/rwydaegh/aegis/actions/runs/${{ github.run_id }}) · the `qa-bot` label triggers an autofix workflow.*`
