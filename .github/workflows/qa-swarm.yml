name: QA swarm

on:
  workflow_dispatch: {}   # Manual trigger only

jobs:
  # Manager: analyzes recent changes and feature surface, assigns 5 non-overlapping scopes
  manager:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      assignments: ${{ steps.extract.outputs.assignments }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get recent commits
        id: commits
        run: |
          RECENT=$(git log --oneline --since="3 days ago" --no-merges -100)
          if [ -z "$RECENT" ]; then
            RECENT=$(git log --oneline -30 --no-merges)
          fi
          {
            echo "log<<COMMITS_EOF"
            echo "$RECENT"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Plan QA assignments
        id: plan
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Read" "Glob" "Grep"'
          prompt: |
            You are the QA swarm manager for AEGIS, a 3D electromagnetic dosimetry viewer at
            https://aegis.waves-ugent.be. Your ONLY job is to produce a JSON assignment plan
            for 5 parallel QA testers. You do NOT test the app yourself.

            ## Recent commits (last 3 days)

            ```
            ${{ steps.commits.outputs.log }}
            ```

            ## Your task

            1. Read the recent commits above. Understand what changed recently.
            2. Explore the codebase briefly (viewer routes, React components, config) to
               understand the full feature surface.
            3. Divide the testing work into exactly 5 non-overlapping scopes. Each scope
               should be a coherent area a single tester can explore in one session.

            **Principles for dividing work:**
            - Areas touched by recent commits get MORE attention (assign a dedicated tester)
            - Cover the full feature surface across all 5 testers combined
            - No two testers should test the same feature -- be specific about boundaries
            - Each assignment should be a starting area and a few suggestions, NOT an
              exhaustive checklist. Write 2-3 sentences describing the area and what to
              pay attention to, then 2-3 specific things worth trying. The tester will
              explore freely from there.
            - Testers are allowed to wander outside their scope if they stumble onto
              something interesting. The scope prevents duplicate STARTING points, not
              duplicate discovery.

            ## Feature areas to cover (divide these among testers)

            - Antenna placement, positioning, nudging (arrow keys), deletion
            - Phantom movement, rotation (Q/E), phantom selection
            - Dosimetry HUD: compliance display, values, units, quantity selector
            - Scene loading, environment settings, voxel tiles
            - Ray tracing mode, stochastic propagation toggle
            - MIMO multi-user mode, precoder settings
            - Parameter controls: frequency bands, power, distance
            - Export panel, analysis features
            - Camera controls, viewpoints, orbit/first-person toggle
            - Base station panel, real antenna patterns
            - Tissue and skin model settings, Cole-Cole parameters
            - Display modes: quantities (Sab, SAR, E-field), color scales
            - Layers panel, visibility toggles, mesh wireframe
            - Sidebar navigation, panel open/close, responsive layout
            - Legend, color bar, scale controls

            ## Output format

            You MUST output EXACTLY this format as the very last thing in your response.
            No markdown fences around it. The JSON must be on a single line.

            ASSIGNMENTS_JSON:{"testers":[{"id":1,"focus":"Short title","instructions":"Detailed testing instructions with bullet points"},{"id":2,...},{"id":3,...},{"id":4,...},{"id":5,...}]}

            The JSON must be valid, on one line, right after "ASSIGNMENTS_JSON:".

      - name: Extract assignments JSON
        id: extract
        run: |
          # Read Claude's response from the execution output file
          EXEC_FILE="${{ steps.plan.outputs.execution_file }}"
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::Claude execution file not found at: $EXEC_FILE"
            ASSIGNMENTS=""
          else
            echo "Execution file: $EXEC_FILE ($(wc -c < "$EXEC_FILE") bytes)"
            # The execution file is JSON. Extract ASSIGNMENTS_JSON from any string value.
            cat > /tmp/extract_assignments.py << 'PYEOF'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          def walk(obj):
              if isinstance(obj, str):
                  m = re.search(r'ASSIGNMENTS_JSON:(\{.*\})', obj)
                  if m:
                      try:
                          json.loads(m.group(1))
                          return m.group(1)
                      except json.JSONDecodeError:
                          pass
              elif isinstance(obj, list):
                  for item in reversed(obj):
                      r = walk(item)
                      if r: return r
              elif isinstance(obj, dict):
                  for v in obj.values():
                      r = walk(v)
                      if r: return r
              return None
          result = walk(data)
          if result:
              print(result)
          PYEOF
            ASSIGNMENTS=$(python3 /tmp/extract_assignments.py "$EXEC_FILE" 2>/dev/null || true)
            echo "Extracted assignments length: ${#ASSIGNMENTS}"
          fi
          if [ -z "$ASSIGNMENTS" ]; then
            echo "::error::Manager did not produce ASSIGNMENTS_JSON output"
            # Fallback: static assignment
            ASSIGNMENTS='{"testers":[{"id":1,"focus":"Antenna and phantom controls","instructions":"Test antenna placement, nudging with arrow keys, deletion. Test phantom rotation with Q/E, phantom selection."},{"id":2,"focus":"Dosimetry and compliance","instructions":"Test HUD values, compliance display, quantity selector, units. Check values after placing antenna and changing parameters."},{"id":3,"focus":"Parameters and modes","instructions":"Test frequency bands, power settings, ray tracing toggle, stochastic propagation, MIMO mode."},{"id":4,"focus":"Panels and UI","instructions":"Test all sidebar panels, layers visibility, export panel, base station panel, tissue settings."},{"id":5,"focus":"Scene and display","instructions":"Test scene loading, camera controls, viewpoints, display modes, color scales, legend, voxel tiles."}]}'
          fi
          echo "assignments=$ASSIGNMENTS" >> "$GITHUB_OUTPUT"

  # Fan out: 5 parallel QA testers, each with their specific assignment
  tester:
    needs: manager
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    strategy:
      matrix:
        tester_id: [1, 2, 3, 4, 5]
      fail-fast: false  # Don't cancel other testers if one fails
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get recent commits
        id: commits
        run: |
          RECENT=$(git log --oneline --since="3 days ago" --no-merges -50)
          if [ -z "$RECENT" ]; then
            RECENT=$(git log --oneline -20 --no-merges)
          fi
          {
            echo "log<<COMMITS_EOF"
            echo "$RECENT"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract my assignment
        id: assignment
        env:
          ALL_ASSIGNMENTS: ${{ needs.manager.outputs.assignments }}
        run: |
          TESTER_ID=${{ matrix.tester_id }}
          FOCUS=$(echo "$ALL_ASSIGNMENTS" | jq -r ".testers[] | select(.id == $TESTER_ID) | .focus")
          INSTRUCTIONS=$(echo "$ALL_ASSIGNMENTS" | jq -r ".testers[] | select(.id == $TESTER_ID) | .instructions")
          {
            echo "focus<<FOCUS_EOF"
            echo "$FOCUS"
            echo "FOCUS_EOF"
            echo "instructions<<INST_EOF"
            echo "$INSTRUCTIONS"
            echo "INST_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run QA tester
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(*)" "Read" "Write" "Glob" "Grep"'
          prompt: |
            You are a user of AEGIS, a 3D electromagnetic dosimetry viewer at
            https://aegis.waves-ugent.be. Your job is to USE the application the way a real
            person would -- place antennas, move the phantom around, change settings, load
            scenes, toggle options -- and see what happens. Exercise the core features hard.
            If things break or crash, that's fine and useful (Sentry will catch JS errors
            automatically). But also keep a sharp eye out for things that LOOK wrong without
            actually crashing: values that don't make sense, UI elements that vanish, controls
            that silently do nothing, inconsistent states. Those silent bugs are the ones only
            you can catch.

            ## Your starting area

            **${{ steps.assignment.outputs.focus }}**

            ${{ steps.assignment.outputs.instructions }}

            Begin there, but don't treat it as a rigid boundary. If clicking around leads you
            somewhere interesting, follow that thread. A real user doesn't stay in one panel.

            ## Recent changes (prioritize testing these)

            These are the most recent commits. Code that changed recently is the most likely to
            have bugs. If any of these touch your starting area, test that functionality extra
            hard. Even if they don't match, try to exercise the changed features.

            ```
            ${{ steps.commits.outputs.log }}
            ```

            ## Setup

            Open the production site in Playwright:
            ```bash
            npx playwright open --browser chromium https://aegis.waves-ugent.be
            ```

            Resize to a standard viewport:
            ```bash
            npx @playwright/cli resize 1920 1080
            ```

            ## How to interact

            **UI elements:** Use `npx @playwright/cli snapshot` to get element refs, then
            `npx @playwright/cli click eNN` or `npx @playwright/cli select eNN "value"`.

            **3D canvas:** R3F uses its own raycaster. You must dispatch PointerEvents via eval:
            ```bash
            npx @playwright/cli evaluate "document.querySelector('canvas').dispatchEvent(new PointerEvent('pointerdown',{clientX:900,clientY:650,bubbles:true,pointerId:1,pointerType:'mouse',button:0}))"
            npx @playwright/cli evaluate "document.querySelector('canvas').dispatchEvent(new PointerEvent('pointerup',{clientX:900,clientY:650,bubbles:true,pointerId:1,pointerType:'mouse',button:0}))"
            ```
            Click to the right of the phantom (clientX=800-1000, clientY=600-700) to place an antenna.

            **Keyboard:** Dispatch on `document` via eval:
            ```bash
            npx @playwright/cli evaluate "document.dispatchEvent(new KeyboardEvent('keydown',{key:'q',code:'KeyQ',bubbles:true}))"
            npx @playwright/cli evaluate "document.dispatchEvent(new KeyboardEvent('keyup',{key:'q',code:'KeyQ',bubbles:true}))"
            ```
            - Q/E: rotate phantom
            - Arrow keys: nudge antenna (1m), Shift+Arrow: 3m
            - Always send both keydown and keyup

            **Scrolling:** Standard scroll events work on panels and dropdowns.

            **Screenshots:** Save to `/tmp/qa_screenshots/` and read with the Read tool:
            ```bash
            mkdir -p /tmp/qa_screenshots
            npx @playwright/cli screenshot /tmp/qa_screenshots/step_01.png
            ```
            Then use the Read tool on the screenshot file to see what's on screen.

            ## How to test

            Be a real user first, a detective second. Actually use the features:
            - Place an antenna and check the dosimetry computes (heatmap appears, HUD shows values)
            - Change settings and see if the result updates
            - Open panels, toggle checkboxes, select dropdown values
            - Try edge cases too: empty inputs, extreme values, rapid toggling, unusual combinations

            After each meaningful action, take a screenshot and read it. Ask yourself:
            "Does this look right? Would a user be confused by this?"

            Things to watch for:
            - Values that seem wrong (zero when they shouldn't be, NaN, --, nonsensical units)
            - UI elements that disappear, overlap, or render incorrectly
            - Controls that don't respond or produce no visible change
            - Text that's truncated, misaligned, or nonsensical
            - States that seem inconsistent (e.g., compliance says PASS but values are extreme)
            - Visual glitches in the 3D scene (missing meshes, wrong colors, clipping)
            - Panels or sections that fail to update after an action
            - HUD elements that vanish or show stale data
            - Dropdowns or toggles that reset unexpectedly

            Check the browser console periodically with `npx @playwright/cli console`.
            Warnings can be interesting clues even if they're not errors.

            Explore for 8-12 meaningful interactions. Start in your assigned area, but if
            something catches your eye -- a weird value, an unexpected state after clicking
            something -- follow it. The best bugs are found by curiosity, not checklists.
            Actually look at each screen and think about whether what you see makes sense.

            ## When you find something wrong

            Only file an issue if the problem is NOT a JavaScript error (Sentry handles those).
            File issues for visual bugs, behavioral oddities, inconsistent states, and things
            that just don't make sense.

            **Before filing, check existing issues to avoid duplicates:**
            ```bash
            gh issue list --label "qa-bot" --state open --limit 20
            ```

            Create a GitHub issue immediately, then keep exploring. You may create multiple
            issues per session, or zero if everything looks fine.

            Save a screenshot showing the problem first:
            ```bash
            npx @playwright/cli screenshot /tmp/qa_screenshots/bug_description.png
            ```

            Then create the issue:
            ```bash
            ISSUE_URL=$(gh issue create \
              --title "Short description of the problem" \
              --label "qa-bot,bug" \
              --body "## What happened

            [2-4 sentences: what you were doing, what you expected, what you saw instead]

            ## Steps to reproduce

            1. Go to https://aegis.waves-ugent.be
            2. [What you clicked/typed]
            3. [What went wrong]

            ## Details

            - **Focus area:** ${{ steps.assignment.outputs.focus }}
            - **Tester:** #${{ matrix.tester_id }} of 5 (swarm run)
            - **Viewport:** 1920x1080
            - **Browser:** Chromium (Playwright)

            ---
            *This issue was filed by the automated QA swarm. The `qa-bot` label triggers
            an autofix workflow.*" 2>&1)
            echo "$ISSUE_URL"
            ```

            ## What NOT to report

            - JavaScript errors or unhandled exceptions (Sentry catches these automatically)
            - Known limitations (WASD movement precision, WebGL warnings, ResizeObserver errors)
            - Performance issues (slow loading, large compute times)
            - Missing features (report broken things, not absent things)
            - THREE.js or WebGL console warnings (these are normal)

            ## When you're done

            After exploring sufficiently, close the browser and write a short summary of what
            you tested and any issues you filed.
            ```bash
            npx @playwright/cli close
            ```
