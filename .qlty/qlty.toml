# Qlty configuration for AEGIS
# Used by both Qlty CLI and Qlty Cloud.
# Docs: https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/node_modules/**",
  "**/vendor/**",
  "**/dist/**",
  "**/build/**",
  "**/site/**",
  "**/__pycache__/**",
  "**/*.egg-info/**",
]

test_patterns = [
  "tests/**",
  "**/test_*.*",
]

[smells]
mode = "comment"

[smells.duplication]
nodes_threshold = 40

[language.python.smells]
function_complexity.threshold = 20
function_parameters.threshold = 8

[[source]]
name = "default"
default = true

# --- Linters ---

[[plugin]]
name = "ruff"
drivers = ["lint"]

[[plugin]]
name = "bandit"

[[plugin]]
name = "radarlint-python"
mode = "comment"

# --- Security ---

[[plugin]]
name = "trufflehog"

# --- CI ---

[[plugin]]
name = "actionlint"

# --- Triage: suppress false positives ---

# B101 (assert usage) is normal in pytest tests and examples
[[triage]]
match.rules = ["bandit:B101"]
match.file_patterns = ["tests/**", "examples/**"]
set.ignored = true

# Subprocess usage is intentional for process management (nvidia-smi, node, kill)
[[triage]]
match.rules = ["bandit:B404", "bandit:B603", "bandit:B607", "bandit:B606"]
set.ignored = true

# Try/except/pass|continue is intentional for optional features (e.g. JAX, DiffeRT)
[[triage]]
match.rules = ["bandit:B110", "bandit:B112"]
set.ignored = true

# Temp file usage is intentional for cache directories
[[triage]]
match.rules = ["bandit:B108"]
set.ignored = true

# SQL injection false positive in examples (SQLite with f-strings for table names)
[[triage]]
match.rules = ["bandit:B608"]
match.file_patterns = ["examples/**"]
set.ignored = true

# Complexity in examples, tools, and tests is acceptable (not production code)
[[triage]]
match.rules = ["radarlint-python:python:S3776", "radarlint-python:python:S1192"]
match.file_patterns = ["examples/**", "tools/**", "tests/**"]
set.ignored = true
