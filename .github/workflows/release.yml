name: Release

on:
  push:
    tags: ['v*']

jobs:
  lint:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12 --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubicloud-standard-2, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python ${{ matrix.python-version }} --extra dev
      - run: uv run pytest tests/ --cov=src/aegis --cov-report=xml -x
      - name: Upload coverage
        if: matrix.os == 'ubicloud-standard-2' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  schemathesis:
    needs: [lint]
    runs-on: ubicloud-standard-2
    # Patch-release tier: catch HTTP-layer regressions (schema drift, 5xx on
    # fuzzed inputs) that PR-tier doesn't afford. Budget ~5 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12 --extra viewer --extra dev
      - name: Start viewer
        run: |
          uv run python -m aegis.viewer --scenario open_ground >/tmp/viewer.log 2>&1 &
          echo $! > /tmp/viewer.pid
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5000/api/openapi.json >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5000/api/openapi.json >/dev/null || {
            echo "viewer failed to start"; tail -80 /tmp/viewer.log; exit 1;
          }
      - name: Schemathesis sweep
        run: |
          uv run schemathesis run http://localhost:5000/api/openapi.json \
            --checks=all \
            --stateful=links \
            --rate-limit=20/s \
            --max-examples=100 \
            --exclude-checks=negative_data_rejection,ignored_auth
      - name: Stop viewer
        if: always()
        run: kill "$(cat /tmp/viewer.pid)" 2>/dev/null || true

  mutmut:
    # Minor-release tier only: mutmut on the physics-critical modules runs on
    # ``vX.Y.0`` tags (not patch releases). Report-only, does not block the
    # release. See docs/internal/testing_roadmap.md Phase 4 and Wave 5 Agent I
    # audit (docs/internal/mutation_audit_2026-04-18.md) for the score baseline.
    if: endsWith(github.ref_name, '.0')
    needs: [lint]
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12 --extra dev --extra viewer
      - name: Mutmut — fresnel
        env:
          AEGIS_DATA_DIR: ${{ github.workspace }}/data
        run: |
          bash scripts/run_mutmut.sh fresnel || true
          echo "::group::Fresnel results"
          uv run mutmut results | tee mutmut_results_fresnel.txt
          echo "::endgroup::"
      - name: Mutmut — compliance
        env:
          AEGIS_DATA_DIR: ${{ github.workspace }}/data
        run: |
          bash scripts/run_mutmut.sh compliance || true
          echo "::group::Compliance results"
          uv run mutmut results | tee mutmut_results_compliance.txt
          echo "::endgroup::"
      - name: Mutmut — _parsing
        env:
          AEGIS_DATA_DIR: ${{ github.workspace }}/data
        run: |
          bash scripts/run_mutmut.sh parsing || true
          echo "::group::_parsing results"
          uv run mutmut results | tee mutmut_results_parsing.txt
          echo "::endgroup::"
      - name: Upload mutmut reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results-${{ github.ref_name }}
          path: mutmut_results_*.txt

  release:
    needs: [lint, test, schemathesis]
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create GitHub release
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
