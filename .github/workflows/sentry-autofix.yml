name: Auto-assign Claude to Sentry issues

# Fallback: if a sentry-labeled issue was created without @claude in the body
# (e.g., manually created), this workflow adds the tag via comment.
# For webhook-created issues, @claude is already in the body.

on:
  issues:
    types: [opened]

jobs:
  tag-claude:
    if: |
      contains(github.event.issue.labels.*.name, 'sentry') &&
      !contains(github.event.issue.body, '@claude')
    runs-on: ubicloud-standard-2
    permissions:
      issues: write
    steps:
      - name: Tag Claude on Sentry issue
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@claude Fix this bug. The issue body has the stack trace, breadcrumbs, and simulation state from Sentry. Follow `.claude/rules/sentry-issues.md` for the workflow.\n\n---\n*Filed by [`sentry-autofix.yml`](https://github.com/rwydaegh/aegis/actions/workflows/sentry-autofix.yml) · triggered by Sentry webhook · the `sentry` label triggers the fix workflow.*'
            });
