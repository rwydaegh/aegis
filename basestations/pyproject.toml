[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "basestationlib"
version = "0.1.0"
description = "Multi-country mobile base station data extraction and standardization library"
readme = "readme.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Matthias Leeman", email = "matthias.leeman@ugent.be"}
]
keywords = [
    "base station",
    "cell tower",
    "mobile networks",
    "telecom",
    "antenna",
    "geospatial",
    "OpenCellID",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pandas>=1.0.0",
    "numpy>=1.19.0",
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "lxml>=4.6.0",
    "pyproj>=3.0.0",
    "scipy>=1.5.0",
    "matplotlib>=3.3.0",
    "tqdm>=4.50.0",
    "pyyaml>=5.3.0",
]

[project.urls]
Homepage = "https://github.ugent.be/mattleem/basestations"
Documentation = "https://github.ugent.be/mattleem/basestations#readme"
Repository = "https://github.ugent.be/mattleem/basestations"
"Bug Tracker" = "https://github.ugent.be/mattleem/basestations/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests", "docs", "examples"]

[tool.setuptools.package-data]
basestationLib = [
    "core/*.json",
    "Countries/Belgium/*.json",
    "Countries/Netherlands/*.json",
]
