# Base station data pipeline configuration
# bbox format: [min_lon, max_lon, min_lat, max_lat] (lon-first, matching basestationLib convention)
regions:
  brussels:
    sources:
      - type: basestationlib
        country: Belgium
        region: brussels
        priority: 1
        source_tag: gov:brussels
    reference: data/basestations/raw/brussels_gov.parquet

  flanders:
    sources:
      - type: basestationlib
        country: Belgium
        region: flanders
        priority: 1
        source_tag: gov:flanders
    reference: data/basestations/raw/brussels_gov.parquet

  france:
    sources:
      - type: basestationlib
        country: France
        # No bbox: module defaults to full metropolitan France
        priority: 1
        source_tag: gov:anfr
    reference: data/basestations/raw/brussels_gov.parquet

  denmark:
    sources:
      - type: mastedatabasen
        # No bbox: fetches all Denmark, client-side filter optional
        priority: 1
        source_tag: gov:mastedatabasen
    reference: data/basestations/raw/brussels_gov.parquet

  netherlands:
    sources:
      - type: basestationlib
        country: Netherlands
        # No bbox: module defaults to full Netherlands
        priority: 1
        source_tag: gov:antenneregister
    reference: data/basestations/raw/brussels_gov.parquet

  austria:
    sources:
      - type: basestationlib
        country: Austria
        # No bbox: module fetches all Austrian sites regardless
        priority: 1
        source_tag: gov:rtr
    reference: data/basestations/raw/brussels_gov.parquet

  germany:
    sources:
      - type: basestationlib
        country: Germany
        bbox: [5.7, 15.2, 47.1, 55.3]
        # bbox required: BNetzA API needs tile-based fetching
        priority: 1
        source_tag: gov:bnetza
    reference: data/basestations/raw/brussels_gov.parquet

  australia:
    sources:
      - type: basestationlib
        country: Australia
        # No bbox: ACMA dataset is national, no filtering needed
        priority: 1
        source_tag: gov:acma
    reference: data/basestations/raw/brussels_gov.parquet

  poland:
    sources:
      - type: basestationlib
        country: Poland
        # No bbox: module defaults to full Poland
        priority: 1
        source_tag: gov:uke
    reference: data/basestations/raw/brussels_gov.parquet

  spain:
    sources:
      - type: basestationlib
        country: Spain
        # No bbox: module has built-in full-Spain default [-9.31, 35.99, 3.33, 43.80]
        priority: 1
        source_tag: gov:vctel
    reference: data/basestations/raw/brussels_gov.parquet

  switzerland:
    sources:
      - type: basestationlib
        country: Switzerland
        # No bbox: module defaults to full Switzerland
        priority: 1
        source_tag: gov:bakom
    reference: data/basestations/raw/brussels_gov.parquet

  canada:
    sources:
      - type: basestationlib
        country: Canada
        # No bbox: ISED ZIP contains full national data
        priority: 1
        source_tag: gov:ised
    reference: data/basestations/raw/brussels_gov.parquet

  new_zealand:
    sources:
      - type: basestationlib
        country: New_Zealand
        # No bbox: module defaults to full NZ
        priority: 1
        source_tag: gov:rsm
    reference: data/basestations/raw/brussels_gov.parquet

  uk:
    sources:
      - type: basestationlib
        country: UK
        # No bbox: WTR CSV is national, filter to mobile operators only
        priority: 1
        source_tag: gov:ofcom_wtr
    reference: data/basestations/raw/brussels_gov.parquet

  brazil:
    sources:
      - type: basestationlib
        country: Brazil
        # No bbox: ANATEL SMP CSV is national (~110K ERBs), bbox filter applied client-side
        priority: 1
        source_tag: gov:anatel_smp
    reference: data/basestations/raw/brussels_gov.parquet

  luxembourg:
    sources:
      - type: basestationlib
        country: Luxembourg
        # No bbox: OGC API covers all of Luxembourg (~2,590 km²), bbox applied internally
        priority: 1
        source_tag: gov:cadastre_gsm
    reference: data/basestations/raw/brussels_gov.parquet
