<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ghent hybrid twin</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #14161a; color: #ddd; font-family: sans-serif; }
  model-viewer { width: 100%; height: 100%; }
  #legend { position: fixed; top: 10px; left: 10px; background: #0009; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; }
</style>
</head>
<body>
<model-viewer src="twin.glb" camera-controls exposure="0.9" shadow-intensity="0.6"
  camera-orbit="35deg 65deg 420m" min-camera-orbit="auto auto 30m" max-camera-orbit="auto auto 1200m"
  interaction-prompt="none" touch-action="pan-y"></model-viewer>
<div id="legend">
  <b>Ghent hybrid twin</b> — 200 m block, Korenmarkt<br>
  67k tris: carved landmarks + audited prisms + terrain + canopy proxies<br>
  <span class="sw" style="background:#8c4333"></span>brick
  <span class="sw" style="background:#e8e0cc"></span>plaster
  <span class="sw" style="background:#cfcfc7"></span>stone
  <span class="sw" style="background:#80b3cc"></span>glass
  <span class="sw" style="background:#4d7a3b"></span>canopy
  <span class="sw" style="background:#999"></span>concrete/default
</div>
</body>
</html>
