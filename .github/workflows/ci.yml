name: CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'aegis-web/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  workflow_call:

jobs:
  lint:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12 --extra dev --extra viewer
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run basedpyright

  test:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12 --extra dev --extra viewer
      - run: uv run pytest tests/ --cov=src/aegis --cov-report=xml -x
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend-coverage:
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: aegis-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aegis-web/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v6
        with:
          files: aegis-web/coverage/lcov.info
          flags: frontend
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
