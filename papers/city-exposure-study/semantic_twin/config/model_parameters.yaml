# Inventory only. This file does not supply defaults to executable code yet.
# Sources use repository-relative paths and 1-based line numbers.
inventory:
  status: proposed_authoritative_inventory
  generated_from: manual read-only audit, 2026-08-05
  scope: configuration-like scientific and pipeline numbers, excluding generated measurement payloads
  source_coverage:
    basis: "targeted inventory assembled from earlier audits, not a claim that every current source file was manually reviewed"
    earlier_audit_record: {python_files_reported: 214, config_json_files_reported: 19}
    sionna_workstream_files_reviewed: 12
    sionna_scope: "two transport modules, four CLI modules, and five figure scripts, plus the final sealed exposure manifest"
    manifest_and_provenance_files_sampled: true
  fields:
    value: current executable or configuration value
    units: SI unless stated otherwise
    source: current owner, symbol, class field, JSON path, or CLI option
    scope: pipeline stage
    status: canonical | default | diagnostic | legacy
    affects_published_results: true | false | conditional
    conflicts: known duplicate or competing setting, or none
  entry_convention:
    conflicts: "Every entry must state a duplicate or say none."
    notes: "Per-entry explanatory notes live only in the companion Markdown review index. Notes are not YAML entry fields."

