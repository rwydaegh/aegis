# Base station data pipeline configuration
# bbox format: [min_lon, max_lon, min_lat, max_lat] (lon-first, matching basestationLib convention)
regions:
  brussels:
    sources:
      - type: basestationlib
        country: Belgium
        region: brussels
        priority: 1
        source_tag: gov:brussels
    reference: data/basestations/raw/brussels_gov.parquet

  flanders:
    sources:
      - type: basestationlib
        country: Belgium
        region: flanders
        priority: 1
        source_tag: gov:flanders
    reference: data/basestations/raw/brussels_gov.parquet

  france:
    sources:
      - type: basestationlib
        country: France
        bbox: [-5.3, 9.8, 42.1, 51.3]
        priority: 1
        source_tag: gov:anfr
      - type: opencellid
        country_code: 208
        bbox: [-5.3, 9.8, 42.1, 51.3]
        priority: 3
        source_tag: ocid
    reference: data/basestations/raw/brussels_gov.parquet

  denmark:
