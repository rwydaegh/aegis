name: Deploy docs

# Docs are now served from docs.aegis.waves-ugent.be via Docker deployment.
# This workflow is kept as a manual fallback for GitHub Pages if needed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12 --extra docs
      - run: uv run mkdocs gh-deploy --force
