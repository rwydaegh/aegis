name: Feature agent

on:
  schedule:
    - cron: "15 */3 * * *"  # Every 3 hours, offset 15min from other agents
  workflow_dispatch: {}

concurrency:
  group: feature-agent
  cancel-in-progress: true

jobs:
  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get recent activity
        id: context
        run: |
          RECENT=$(git log --oneline --since="3 days ago" --no-merges -50)
          if [ -z "$RECENT" ]; then
            RECENT=$(git log --oneline -20 --no-merges)
          fi
          {
            echo "log<<COMMITS_EOF"
            echo "$RECENT"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

          # Get open issues for context on what users want
          ISSUES=$(gh issue list --state open --limit 10 --json number,title,labels --jq '.[] | "#\(.number) [\(.labels | map(.name) | join(","))] \(.title)"' 2>/dev/null || echo "")
          {
            echo "issues<<ISSUES_EOF"
            echo "$ISSUES"
            echo "ISSUES_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run feature agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-6'
          prompt: |
            You are an autonomous Opus agent improving the AEGIS codebase. You run every
            3 hours on a fresh clone. Robin (physics PhD, Ghent University) trusts you to
            make the product better while he is not looking.

            NEVER ask questions. NEVER wait for input. You are Opus. Be smart, opinionated,
            and ambitious.

            ## What is AEGIS

            AEGIS computes absorbed power density (Sab) on human body meshes exposed to
            wireless base station radiation. Core equation:
            Sab(r) = Sinc * T0 * ReLU[n_hat(r) * (-k_hat)]. Nine fidelity levels (0-8),
            from O(1) bounds to coherent MIMO beamforming with ECBF optimization. Python
            physics stack (NumPy/SciPy, optional JAX). Flask + React/Three.js 3D viewer
            with Zustand state. Ray tracing via Sionna and DiffeRT.

            This is a real research tool, not a toy. The summary paper
            (../monograph/summary_paper.tex) is a condensed reference for the physics.
            The code should match the math.

            ## Your environment

            - No GPU, no mesh STL data files, no Sionna/DiffeRT backends
            - Python 3.x available (use python3). Node.js available (npm/npx work).
            - `pytest -m 'not slow'` skips tests that need mesh data
            - You CAN touch the React frontend. `cd aegis-web && npm install && npm run build`
              works. You cannot visually verify, but you can lint (`npx tsc --noEmit`,
              `npx eslint src/`), build, and reason about correctness from the code.

            ## Recent commits

            ```
            ${{ steps.context.outputs.log }}
            ```

            ## Open issues

            ```
            ${{ steps.context.outputs.issues }}
            ```

            Fix open issues if you can. They represent real user pain. Prefer fixing a real
            bug over inventing an improvement.

            ## Setup

            ```bash
            python3 -m pip install -e '.[dev]' --quiet
            ```

            ## What to work on

            You decide. Read the codebase, CLAUDE.md, recent git history. Understand where
            AEGIS is and what would make it better. Then do the most valuable work you can.

            Priority order (what Robin cares about most):
            1. Fix open issues and real bugs (the list above)
            2. New features and capabilities that make AEGIS more useful as a product
            3. Performance improvements in hot paths (kernels, geometry, spatial averaging)
            4. Better error messages, input validation, developer experience
            5. Code quality improvements that reduce real bug risk

            We already have ~1600 tests and ~60% coverage. Do NOT write tests unless they
            are for code you just wrote or changed. The test suite is also slow. Do not
            make it slower without good reason.

            Areas of the codebase:
            - src/aegis/engine.py - main dispatch, 9 fidelity levels
            - src/aegis/kernels/ - one file per level, the actual physics
            - src/aegis/tissue/ - Fresnel, Cole-Cole, tissue database
            - src/aegis/geometry/ - mesh ops, spatial averaging, ambient occlusion
            - src/aegis/coherent/ - field channel, exposure operator Q, ECBF solver
            - src/aegis/compliance/ - ICNIRP 2020 limits
            - src/aegis/viewer/ - Flask backend, routes, config
            - src/aegis/integration/ - DiffeRT and Sionna bridges
            - aegis-web/ - React + Three.js frontend (Vite, R3F, Zustand)

            ## How to work

            1. Install deps, run tests to establish baseline:
               ```bash
               python3 -m pytest tests/ -m 'not slow' -x --tb=short -q
               ```

            2. Read around. Decide what to work on. Pick the highest-value thing.

            3. Do it. Test it. Lint it:
               ```bash
               python3 -m pytest tests/ -m 'not slow' -x
               python3 -m ruff check src/ tests/ && python3 -m ruff format src/ tests/
               ```

            4. Create a PR and merge it:
               ```bash
               git checkout -b claude/DESCRIPTION
               git add <specific files>
               git commit -m "Imperative description of the change"
               git push -u origin claude/DESCRIPTION
               gh pr create \
                 --title "Imperative description" \
                 --body "## Summary
               - What was added/changed
               - Why it is valuable
               - How it was tested

               Fixes #N (if applicable)

               ---
            *Built by [`feature-agent.yml`](https://github.com/rwydaegh/aegis/actions/workflows/feature-agent.yml) · run [${{ github.run_id }}](https://github.com/rwydaegh/aegis/actions/runs/${{ github.run_id }})*" \
                 --base master
               gh pr merge --squash --delete-branch
               git checkout master
               git pull origin master
               ```

            5. You may do multiple changes per session if they are independent. One PR each.

            ## What NOT to do

            - Do not change core physics equations unless the code clearly contradicts the
              math in ../monograph/summary_paper.tex
            - Do not break existing tests (fix your change, not the test)
            - Do not write tests for existing code that you did not change
            - Do not create documentation files or READMEs
            - Do not do busywork (docstrings on obvious functions, comments on clear code,
              type annotations on code you did not change)
            - Do not add speculative abstractions or design for hypothetical futures

            Be bold. Be opinionated. Ship something that makes AEGIS better as a product.
