name: Auto-assign Claude to Sentry issues

on:
  issues:
    types: [opened, labeled]

jobs:
  tag-claude:
    if: contains(github.event.issue.labels.*.name, 'sentry')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Tag Claude on Sentry issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@claude Fix this bug. The issue body has the stack trace, breadcrumbs, and simulation state from Sentry. Follow `.claude/rules/sentry-issues.md` for the workflow.'
            });
