name: Benchmarks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra benchmark

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4.19.1
        with:
          mode: simulation
          run: uv run pytest benchmarks/ --codspeed -n 0
