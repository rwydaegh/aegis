name: Auto-merge Claude PRs

# Trigger when CI completes on a PR
on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

jobs:
  auto-merge:
    # Only if the deploy/CI succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Find and merge Claude PRs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "Checking branch: $BRANCH"

          # Only process claude/ branches
          if [[ "$BRANCH" != claude/* ]]; then
            echo "Not a Claude branch, skipping"
            exit 0
          fi

          # Find the open PR for this branch
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch $BRANCH"
            exit 0
          fi

          echo "Merging PR #$PR_NUMBER (branch: $BRANCH)"
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch
