[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
name = "aegis"
dynamic = ["version"]
description = "GPU-accelerated geometric dosimetry engine for wireless exposure assessment."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "rwydaegh", email = "robin.wydaeghe@ugent.be"}]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10,<2",
    "pyyaml>=6.0",
]

[project.scripts]
aegis = "aegis.__main__:main"
aegis-run = "aegis.run:main"

[project.optional-dependencies]
fast = ["numba>=0.59"]
jax = ["jax>=0.4.20"]
gpu = ["jax[cuda12]>=0.4.20"]
viz = [
    "matplotlib>=3.7",
    "plotly>=5.18",
    "pyvista>=0.43",
    "trame>=3.0",
    "scienceplots>=2.1.0",
]
viewer = ["flask>=3.0", "psutil>=5.9", "differt @ git+https://github.com/rwydaegh/DiffeRT.git#subdirectory=differt", "modal>=0.73", "requests>=2.31", "pandas>=1.5", "geopy>=2.4"]
rt = ["differt @ git+https://github.com/rwydaegh/DiffeRT.git#subdirectory=differt"]
sionna = ["sionna-rt>=2.0,<3.0"]
modal = ["modal>=0.73"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7,<10.15",
    "pygments>=2.17,<2.20",
    "mkdocstrings[python]>=0.24",
    "mkdocs-minify-plugin>=0.7",
    "jupytext>=1.16",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-cov>=4.0",
    "hypothesis>=6.90",
    "ruff>=0.4",
    "pre-commit>=3.5",
    "codespell>=2.2",
    "miepython>=2.6",
    "requests>=2.31",
    "pandas>=1.5",
]
benchmark = ["pytest-codspeed>=3.0"]
cloud = ["requests>=2.31"]
all = ["aegis[jax,gpu,viz,viewer,rt,sionna,docs,dev,cloud,modal,benchmark]"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/aegis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]
artifacts = ["src/aegis/viewer/static/**"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["src/aegis/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
pythonpath = [".", "src"]
markers = [
    "slow: tests that need mesh data or take >10s",
]
# pytest-xdist: two workers (balance of throughput vs RAM; avoid -n auto on dev machines)
addopts = "-ra --strict-markers --import-mode=prepend -n 2"

[tool.codespell]
ignore-words-list = "te,nd,ue,lod,coner"

[tool.coverage.run]
source = ["aegis"]
parallel = true
# Omitted paths: optional Sionna bridge, viewer CLI, voxel pipeline glue
omit = [
    "*/viewer/__main__.py",
    "*/viewer/pipeline.py",
    "*/integration/sionna.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]
