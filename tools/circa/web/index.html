<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>circa</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar">
    <span id="status-build" class="ok">build: ok</span>
    <span id="queue-badge">0 pending</span>
    <div id="tools">
      <button data-tool="pen" class="active">1 Pen</button>
      <button data-tool="arrow">2 Arrow</button>
      <button data-tool="rect">3 Rect</button>
      <button data-tool="text">4 Text</button>
    </div>
    <button id="rebuild-btn">R Rebuild</button>
    <span id="pass-label">pass 1</span>
  </header>
  <main>
    <section id="pdf-col"></section>
    <aside id="diff-side"><pre id="diff-content"></pre></aside>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
