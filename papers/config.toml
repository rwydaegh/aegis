# Portable version of Robin's Codex settings.
# Requires an account with access to this model and the fast service tier.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
service_tier = "fast"

# Unrestricted machine access with no approval prompts. Only use this on a
# machine and in repositories you trust.
approval_policy = "never"
sandbox_mode = "danger-full-access"

[history]
persistence = "save-all"

# Stable multi-agent configuration. Subagents are built into current Codex
# releases, so no experimental feature flags are needed.
[agents]
enabled = true
max_concurrent_threads_per_session = 1024

[tui]
status_line = ["model-with-reasoning", "context-used", "five-hour-limit", "weekly-limit", "git-branch", "current-dir"]
status_line_use_colors = true
