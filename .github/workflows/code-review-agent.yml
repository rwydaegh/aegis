name: Code review agent

on:
  schedule:
    - cron: "30 */2 * * *"  # Every 2 hours, offset 30min from qa-agent
  workflow_dispatch: {}

concurrency:
  group: code-review-agent
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get recent commits with diffs
        id: commits
        run: |
          RECENT=$(git log --oneline --since="12 hours ago" --no-merges -50)
          if [ -z "$RECENT" ]; then
            RECENT=$(git log --oneline -10 --no-merges)
          fi
          {
            echo "log<<COMMITS_EOF"
            echo "$RECENT"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

          # Get the diff summary for recently changed files
          SINCE_SHA=$(git log --since="12 hours ago" --no-merges --format="%H" | tail -1)
          if [ -n "$SINCE_SHA" ]; then
            DIFF=$(git diff --stat "$SINCE_SHA"..HEAD 2>/dev/null || echo "")
          else
            DIFF=$(git diff --stat HEAD~10..HEAD 2>/dev/null || echo "")
          fi
          {
            echo "diff<<DIFF_EOF"
            echo "$DIFF"
            echo "DIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Pick review focus
        id: focus
        run: |
          AREAS=(
            "React components: state management, error boundaries, stale closures, missing cleanup"
            "viewer feature completeness: trace user flows end-to-end, find dead code paths and unfinished features"
            "frontend data flow: Zustand store updates, API response handling, loading/error states"
            "viewer backend routes and API edge cases"
            "integration bridges (DiffeRT, Sionna) and ray tracing pipeline"
            "error handling and input validation at system boundaries"
            "physics kernels and compliance (all levels, ECBF, spatial averaging, ICNIRP limits)"
            "base station pipeline: scrapers, adapters, merge, coverage computation"
            "3D scene: Three.js resource lifecycle, geometry disposal, camera state, rendering"
            "type safety and API contracts across frontend and backend"
          )
          INDEX=$((RANDOM % ${#AREAS[@]}))
          echo "area=${AREAS[$INDEX]}" >> "$GITHUB_OUTPUT"

      - name: Load prompt
        id: load_prompt
        run: |
          {
            echo "content<<PROMPT_EOF"
            cat agent_hq/prompts/code-reviewer.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/aegis-overview.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/environment.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/how-to-ship.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/not-bugs.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run code review agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-7 --allowedTools "Edit,Read,Write,Glob,Grep,Bash(*),WebSearch,WebFetch,Agent"'
          prompt: |
            ${{ steps.load_prompt.outputs.content }}

            ## Your focus this session

            **${{ steps.focus.outputs.area }}**

            ## Recent changes
            ```
            ${{ steps.commits.outputs.log }}
            ```

            Changed files:
            ```
            ${{ steps.commits.outputs.diff }}
            ```
