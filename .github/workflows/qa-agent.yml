name: QA agent

on:
  schedule:
    - cron: "0 */2 * * *"  # Every 2 hours
  workflow_dispatch: {}     # Manual trigger for testing

concurrency:
  group: qa-agent
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for git log

      - name: Get recent commits
        id: commits
        run: |
          RECENT=$(git log --oneline --since="2 days ago" --no-merges -100)
          if [ -z "$RECENT" ]; then
            RECENT=$(git log --oneline -20 --no-merges)
          fi
          {
            echo "log<<COMMITS_EOF"
            echo "$RECENT"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Pick random focus area
        id: focus
        run: |
          AREAS=(
            "Antenna placement and positioning"
            "Phantom movement and rotation"
            "Dosimetry HUD and compliance display"
            "Scene loading and environment"
            "Ray tracing integration"
            "Stochastic propagation"
            "MIMO multi-user mode"
            "Parameter controls and frequency bands"
            "Export and analysis panels"
            "Camera controls and viewpoints"
            "Base station panel"
            "Tissue and skin model settings"
            "Quantities and display modes"
            "Layers panel and visibility toggles"
            "Voxel environment and 3D tiles"
          )
          INDEX=$((RANDOM % ${#AREAS[@]}))
          echo "area=${AREAS[$INDEX]}" >> "$GITHUB_OUTPUT"

      - name: Run QA agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-6 --allowedTools "Bash(*)" "Read" "Write" "Glob" "Grep"'
          prompt: |
            You are a user of AEGIS, a 3D electromagnetic dosimetry viewer at
            https://aegis.waves-ugent.be. Your job is to USE the application the way a real
            person would -- place antennas, move the phantom around, change settings, load
            scenes, toggle options -- and see what happens. Exercise the core features hard.
            If things break or crash, that's fine and useful (Sentry will catch JS errors
            automatically). But also keep a sharp eye out for things that LOOK wrong without
            actually crashing: values that don't make sense, UI elements that vanish, controls
            that silently do nothing, inconsistent states. Those silent bugs are the ones only
            you can catch.

            ## Your focus area this session

            **${{ steps.focus.outputs.area }}**

            Start here, but don't limit yourself. Use the app naturally -- if testing antenna
            placement leads you into changing frequency bands, go with it. A real user doesn't
            stay in one panel.

            ## Recent changes (prioritize testing these)

            These are the most recent commits. Code that changed recently is the most likely to
            have bugs. If any of these touch your focus area, test that functionality extra hard.
            Even if they don't match your focus area, try to exercise the changed features.

            ```
            ${{ steps.commits.outputs.log }}
            ```

            ## Setup

            Open the production site in Playwright:
            ```bash
            npx playwright open --browser chromium https://aegis.waves-ugent.be
            ```

            Resize to a standard viewport:
            ```bash
            npx @playwright/cli resize 1920 1080
            ```

            ## How to interact

            **UI elements:** Use `npx @playwright/cli snapshot` to get element refs, then
            `npx @playwright/cli click eNN` or `npx @playwright/cli select eNN "value"`.

            **3D canvas:** R3F uses its own raycaster. You must dispatch PointerEvents via eval:
            ```bash
            npx @playwright/cli evaluate "document.querySelector('canvas').dispatchEvent(new PointerEvent('pointerdown',{clientX:900,clientY:650,bubbles:true,pointerId:1,pointerType:'mouse',button:0}))"
            npx @playwright/cli evaluate "document.querySelector('canvas').dispatchEvent(new PointerEvent('pointerup',{clientX:900,clientY:650,bubbles:true,pointerId:1,pointerType:'mouse',button:0}))"
            ```
            Click to the right of the phantom (clientX=800-1000, clientY=600-700) to place an antenna.

            **Keyboard:** Dispatch on `document` via eval:
            ```bash
            npx @playwright/cli evaluate "document.dispatchEvent(new KeyboardEvent('keydown',{key:'q',code:'KeyQ',bubbles:true}))"
            npx @playwright/cli evaluate "document.dispatchEvent(new KeyboardEvent('keyup',{key:'q',code:'KeyQ',bubbles:true}))"
            ```
            - Q/E: rotate phantom
            - Arrow keys: nudge antenna (1m), Shift+Arrow: 3m
            - Always send both keydown and keyup

            **Scrolling:** Standard scroll events work on panels and dropdowns.

            **Screenshots:** Save to `/tmp/qa_screenshots/` and read with the Read tool:
            ```bash
            mkdir -p /tmp/qa_screenshots
            npx @playwright/cli screenshot /tmp/qa_screenshots/step_01.png
            ```
            Then use the Read tool on the screenshot file to see what's on screen.

            ## How to test

            Be a real user first, a detective second. Actually use the features:
            - Place an antenna and check the dosimetry computes (heatmap appears, HUD shows values)
            - Change settings and see if the result updates
            - Open panels, toggle checkboxes, select dropdown values
            - Try edge cases too: empty inputs, extreme values, rapid toggling, unusual combinations

            After each meaningful action, take a screenshot and read it. Ask yourself:
            "Does this look right? Would a user be confused by this?"

            Things to watch for:
            - Values that seem wrong (zero when they shouldn't be, NaN, --, nonsensical units)
            - UI elements that disappear, overlap, or render incorrectly
            - Controls that don't respond or produce no visible change
            - Text that's truncated, misaligned, or nonsensical
            - States that seem inconsistent (e.g., compliance says PASS but values are extreme)
            - Visual glitches in the 3D scene (missing meshes, wrong colors, clipping)
            - Panels or sections that fail to update after an action
            - HUD elements that vanish or show stale data
            - Dropdowns or toggles that reset unexpectedly

            Check the browser console periodically with `npx @playwright/cli console`.
            Warnings can be interesting clues even if they're not errors.

            Explore for 8-12 meaningful interactions. Don't rush through a checklist -- actually
            look at each screen and think about whether what you see makes sense.

            ## When you find something wrong

            Only file an issue if the problem is NOT a JavaScript error (Sentry handles those).
            File issues for visual bugs, behavioral oddities, inconsistent states, and things
            that just don't make sense.

            Create a GitHub issue immediately, then keep exploring. You may create multiple
            issues per session, or zero if everything looks fine.

            **Labeling:** Before filing your first issue, run `gh label list` to see all
            available labels. Always include `qa-bot` and `bug`. Then add any other labels
            that fit the issue (e.g., `viewer` for frontend bugs, `physics` for computation
            errors, `frontend` for UI/layout issues). Use your judgment -- pick labels that
            help a developer find the issue quickly.

            Save a screenshot showing the problem first:
            ```bash
            npx @playwright/cli screenshot /tmp/qa_screenshots/bug_description.png
            ```

            Then create the issue:
            ```bash
            ISSUE_URL=$(gh issue create \
              --title "Short description of the problem" \
              --label "qa-bot,bug,<other relevant labels>" \
              --body "## What happened

            [2-4 sentences: what you were doing, what you expected, what you saw instead]

            ## Steps to reproduce

            1. Go to https://aegis.waves-ugent.be
            2. [What you clicked/typed]
            3. [What went wrong]

            ## Details

            - **Focus area:** ${{ steps.focus.outputs.area }}
            - **Viewport:** 1920x1080
            - **Browser:** Chromium (Playwright)

            ---
            *Filed by [`qa-agent.yml`](https://github.com/rwydaegh/aegis/actions/workflows/qa-agent.yml) · run [${{ github.run_id }}](https://github.com/rwydaegh/aegis/actions/runs/${{ github.run_id }}) · the `qa-bot` label triggers an autofix workflow.*" 2>&1)
            echo "$ISSUE_URL"
            ```

            ## What NOT to report

            - JavaScript errors or unhandled exceptions (Sentry catches these automatically)
            - Known limitations (WASD movement precision, WebGL warnings, ResizeObserver errors)
            - Performance issues (slow loading, large compute times)
            - Missing features (report broken things, not absent things)
            - THREE.js or WebGL console warnings (these are normal)

            ## When you're done

            After exploring sufficiently, close the browser and write a short summary of what
            you tested and any issues you filed.
            ```bash
            npx @playwright/cli close
            ```
