name: Deploy

on:
  push:
    branches: [master]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aegis-web/package-lock.json

      - name: Build React frontend
        working-directory: aegis-web
        run: |
          npm ci
          npm run build
          node scripts/copy-to-flask.mjs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build docs
        run: |
          pip install uv
          uv pip install --system ".[docs]"
          python -m mkdocs build

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            CACHE_BUST=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Deploy to Hetzner
        if: vars.HETZNER_HOST != ''
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ vars.HETZNER_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@$HOST"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            docker-compose.yml Caddyfile root@$HOST:/opt/aegis/
          $SSH "echo '$GH_TOKEN' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
            cd /opt/aegis && docker compose pull && docker compose up -d && docker image prune -f"

      - name: Health check
        if: vars.HETZNER_HOST != ''
        run: |
          sleep 15
          curl -sf https://aegis.waves-ugent.be/api/health || echo "::warning::Health check failed - server may still be starting"

  modal-deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Modal
        run: pip install "modal>=0.73"
      - name: Install AEGIS (for mount)
        run: pip install -e .
      - name: Deploy Modal app
        run: modal deploy src/aegis/modal_rt/__init__.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
