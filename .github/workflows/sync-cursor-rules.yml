name: Sync Cursor rules

on:
  push:
    tags: ['v*']
    paths:
      - 'CLAUDE.md'
      - '.claude/rules/**'
      - '.claude/ai_writing_tells.md'
      - 'scripts/sync-cursor-rules.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync .claude -> .cursor/rules
        run: python scripts/sync-cursor-rules.py

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet .cursor/rules/ && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .cursor/rules/
          git commit -m "Sync Cursor rules from .claude sources"
          git push origin master
