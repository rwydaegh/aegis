name: QA agent

on:
  schedule:
    - cron: "0 */2 * * *"  # Every 2 hours
  workflow_dispatch: {}     # Manual trigger for testing

concurrency:
  group: qa-agent
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for git log

      - name: Get recent commits
        id: commits
        run: |
          RECENT=$(git log --oneline --since="2 days ago" --no-merges -100)
          if [ -z "$RECENT" ]; then
            RECENT=$(git log --oneline -20 --no-merges)
          fi
          {
            echo "log<<COMMITS_EOF"
            echo "$RECENT"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Pick random focus area
        id: focus
        run: |
          AREAS=(
            "Antenna placement and positioning"
            "Phantom movement and rotation"
            "Dosimetry HUD and compliance display"
            "Scene loading and environment"
            "Ray tracing integration"
            "Stochastic propagation"
            "MIMO multi-user mode"
            "Parameter controls and frequency bands"
            "Export and analysis panels"
            "Camera controls and viewpoints"
            "Base station panel"
            "Tissue and skin model settings"
            "Quantities and display modes"
            "Layers panel and visibility toggles"
            "Voxel environment and 3D tiles"
          )
          INDEX=$((RANDOM % ${#AREAS[@]}))
          echo "area=${AREAS[$INDEX]}" >> "$GITHUB_OUTPUT"

      - name: Load prompt
        id: load_prompt
        run: |
          {
            echo "content<<PROMPT_EOF"
            cat agent_hq/prompts/qa-tester.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/aegis-overview.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/not-bugs.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run QA agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-6 --allowedTools "Edit,Read,Write,Glob,Grep,Bash(*),WebSearch,WebFetch,Agent"'
          prompt: |
            ${{ steps.load_prompt.outputs.content }}

            ## Your focus area this session

            **${{ steps.focus.outputs.area }}**

            Start here, but don't limit yourself. Use the app naturally.

            ## Recent changes (prioritize testing these)
            ```
            ${{ steps.commits.outputs.log }}
            ```
