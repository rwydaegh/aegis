services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: app.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - docs_site:/srv/docs:ro
    depends_on:
      flask:
        condition: service_healthy

  flask:
    image: ghcr.io/rwydaegh/aegis:${IMAGE_TAG:-latest}
    hostname: aegis-prod
    restart: unless-stopped
    env_file: app.env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - docs_site:/srv/docs
      - pipeline_cache:/app/pipeline_cache
      # Persistent numba JIT cache so the boot-time kernel warm-up is a fast
      # cache load (not a ~60 s recompile) after the first deploy. Path matches
      # NUMBA_CACHE_DIR in the Dockerfile.
      - numba_cache:/numba-cache
      # SMPL-X parametric body models (license-gated, never in the repo or image).
      # Files live on the host at /opt/aegis/models/smplx/ and are read by
      # ParametricBody.load("smplx") at /root/.aegis/models inside the container.
      - /opt/aegis/models:/root/.aegis/models:ro
    mem_limit: 3g

  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me-to-random-string}
      CLIENT_IP_HEADER: X-Forwarded-For
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  docs_site:
  pipeline_cache:
  numba_cache:
  umami_data:
