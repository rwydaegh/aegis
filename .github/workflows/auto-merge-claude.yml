name: Auto-merge Claude PRs

on:
  pull_request:
    types: [opened]

jobs:
  auto-merge:
    # Only auto-merge PRs from the Claude bot on claude/* branches
    if: |
      github.event.pull_request.user.login == 'claude[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge Claude PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Merging PR #${{ github.event.pull_request.number }} (branch: ${{ github.event.pull_request.head.ref }})"
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --delete-branch
