[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
name = "aegis"
dynamic = ["version"]
description = "GPU-accelerated geometric dosimetry engine for wireless exposure assessment."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Proprietary"}
authors = [{name = "rwydaegh", email = "robin.wydaeghe@ugent.be"}]

dependencies = [
    "numpy>=2.4.4",
    "scipy>=1.17.1,<2",
    "pyyaml>=6.0.3",
]

[project.scripts]
aegis = "aegis.__main__:main"
aegis-run = "aegis.run:main"

[project.optional-dependencies]
fast = ["numba>=0.65.1"]
jax = ["jax>=0.10.0"]
gpu = ["jax[cuda12]>=0.10.0"]
viz = [
    "matplotlib>=3.10.9",
    "plotly>=6.7.0",
    "pyvista>=0.43",
    "trame>=3.12.0",
    "scienceplots>=2.2.1",
]
viewer = ["flask>=3.1.3", "psutil>=7.2.2", "differt @ git+https://github.com/rwydaegh/DiffeRT.git#subdirectory=differt", "modal>=1.4.2", "requests>=2.31", "pandas>=3.0.2", "geopy>=2.4.1", "Pillow>=12.2", "pyarrow>=14.0"]
rt = ["differt @ git+https://github.com/rwydaegh/DiffeRT.git#subdirectory=differt"]
sionna = ["sionna-rt>=2.0.1,<3.0"]
modal = ["modal>=1.4.2"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.7.6",
    "pymdown-extensions>=10.21.2,<10.22",
    "pygments>=2.20,<2.21",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-minify-plugin>=0.7",
    "jupytext>=1.19.1",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.152.4",
    "ruff>=0.15.12",
    "basedpyright>=1.39.3",
    "pre-commit>=4.6.0",
    "codespell>=2.4.2",
    "miepython>=3.2.0",
    "requests>=2.31",
    "pandas>=3.0.2",
    "pyarrow>=14.0",
    # Schemathesis drives the OpenAPI fuzzer at release-tier and the in-process
    # smoke test in tests/test_viewer_schemathesis_smoke.py.
    "schemathesis>=4.17.0",
    "apispec>=6.10",
    # Mutmut runs as a local audit + minor-release CI tool, not per-PR. See
    # docs/internal/testing_roadmap.md (Phase 4) for the tiering rationale.
    "mutmut>=3.5.0",
]
body = ["smplx>=0.1.28", "torch>=2.11.0", "pygltflib>=1.16.5"]
benchmark = ["pytest-codspeed>=4.5.0"]
cloud = ["requests>=2.31"]
all = ["aegis[jax,gpu,viz,viewer,rt,sionna,docs,dev,cloud,modal,benchmark]"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/aegis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]
artifacts = ["src/aegis/viewer/static/**"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["src/aegis/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PT"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
pythonpath = [".", "src"]
markers = [
    "slow: tests that need mesh data or take >10s",
]
# pytest-xdist: two workers (balance of throughput vs RAM; avoid -n auto on dev machines)
addopts = "-ra --strict-markers --import-mode=prepend -n 2"

[tool.codespell]
ignore-words-list = "te,nd,ue,lod,coner"

[tool.coverage.run]
source = ["src/aegis"]
branch = true
parallel = true
# Omitted paths: optional Sionna bridge, viewer CLI, voxel pipeline glue
omit = [
    "*/viewer/__main__.py",
    "*/viewer/pipeline.py",
    "*/integration/sionna.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

[tool.mutmut]
# Mutation testing — local audit + minor-release CI tier only. Mutmut v3 is
# config-only: pick the target file(s) by editing paths_to_mutate or via
# scripts/run_mutmut.sh which rewrites these lines per-invocation. See
# docs/internal/testing_roadmap.md Phase 4 for rationale.
paths_to_mutate = [
    "src/aegis/tissue/fresnel.py",
]
tests_dir = [
    "tests/test_fresnel.py",
]
# Override pyproject addopts (``-n 2`` conflicts with mutmut's own xdist args)
# and skip slow-marked tests. Mutmut itself adds ``-x -q -p no:randomly
# -p no:random-order`` to every pytest invocation.
pytest_add_cli_args = [
    "-o",
    "addopts=",
    "-m",
    "not slow",
    "-p",
    "no:cacheprovider",
    # Hypothesis raises "differing executors" when mutmut re-enters the same
    # test under its own plugin stack; skip the property-based test here.
    "--deselect",
    "tests/test_fresnel.py::TestFresnelEdgeCases::test_T0_positive_hypothesis",
]
# Copy the rest of src/ (unmutated) plus configs/ so tests can import aegis.*
# inside mutants/. The 1.3 GB data/ tree stays outside; set AEGIS_DATA_DIR so
# tests that need the IT'IS database (viewer routes) find it.
also_copy = ["src/", "configs/"]
# Skip generated files.
do_not_mutate = [
    "*/_version.py",
]

[tool.basedpyright]
include = ["src/aegis/kernels", "src/aegis/compliance", "src/aegis/viewer/routes"]
# Kernels and compliance are strict. Routes use a custom ruleset (see below) that
# demotes reportUnknown* boundary noise (Flask/numpy untyped surfaces) while
# keeping real type bugs (Optional handling, return type mismatches, bad args to
# typed APIs) as errors. Adding routes to strict would force reportUnknown* back
# to error level regardless of the global overrides.
strict = ["src/aegis/kernels", "src/aegis/compliance"]
pythonVersion = "3.12"
reportMissingTypeStubs = false
# JAX and numpy return `Any` from many ops because stubs are incomplete; forcing
# casts at every boundary is noise, not safety. Keep the signal visible at
# information level and address real shape bugs via jaxtyping later if needed.
reportAny = "information"
reportExplicitAny = "information"
# Unparameterized generics (e.g. `dict`, `list`) pervade the Flask/numpy edges;
# requiring explicit type args across route signatures is churn, not safety.
reportMissingTypeArgument = "information"
# f-string line wrapping ("foo " f"bar") is standard Python; not a real bug.
reportImplicitStringConcatenation = "none"
# Flask request.get_json(), numpy reductions, and pandas .rename/.map return
# untyped values at HTTP/data boundaries. These fire thousands of times across
# routes and carry no real-bug signal; keep visible as information notes.
reportUnknownVariableType = "information"
reportUnknownArgumentType = "information"
reportUnknownMemberType = "information"
reportUnknownParameterType = "information"
reportUnknownLambdaType = "information"
reportMissingParameterType = "information"
# Flask registers view functions via @bp.route; basedpyright can't see the use.
reportUnusedFunction = "information"

# Routes get an explicit ruleset: strict-equivalent bug-catching checks enabled
# as errors, but reportUnknown*/reportMissingType* demoted to information since
# Flask's request.get_json(), request.args, and numpy ops return untyped values
# at HTTP boundaries. TypedDict'ing every request body would be pure churn.
reportArgumentType = "error"
reportReturnType = "error"
reportAssignmentType = "error"
reportCallIssue = "error"
reportIndexIssue = "error"
reportOperatorIssue = "error"
reportAttributeAccessIssue = "error"
reportGeneralTypeIssues = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportUnboundVariable = "error"
reportUndefinedVariable = "error"
# Underscore-prefixed helpers shared across sibling modules in the routes package
# are an intentional "package-private" pattern, not accidental API leakage.
reportPrivateUsage = "information"
reportTypedDictNotRequiredAccess = "error"
reportRedeclaration = "error"
# compute/rt.py, sionna_rt.py, voxel_rt.py, scenes.py deliberately import back
# from aegis.viewer.routes.compute (the package) to expose test-mockable proxies.
# This is an intentional re-export pattern; the cycle is structural, not a bug.
reportImportCycles = "information"
reportInvalidTypeForm = "error"
reportInvalidTypeVarUse = "error"
reportUnusedImport = "information"
reportUnusedVariable = "information"
# Flask handlers often accept unused args (decorator contract).
reportUnusedParameter = "information"
reportUnusedCallResult = "none"
# JAX @jit and Flask @bp.route are untyped from basedpyright's view.
reportUntypedFunctionDecorator = "information"
