# Qlty configuration for AEGIS
# Used by both Qlty CLI and Qlty Cloud.
# Docs: https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/node_modules/**",
  "**/vendor/**",
  "**/dist/**",
  "**/build/**",
  "**/site/**",
  "**/__pycache__/**",
  "**/*.egg-info/**",
  # React build artifacts (source is in aegis-web/)
  "src/aegis/viewer/static/assets/**",
  # Legacy HTML viewer (replaced by React app)
  "src/aegis/viewer/templates/_legacy*",
]

test_patterns = [
  "tests/**",
  "**/test_*.*",
]

[smells]
mode = "comment"

[smells.duplication]
nodes_threshold = 40

[language.python.smells]
function_complexity.threshold = 20
function_parameters.threshold = 8

[[source]]
name = "default"
default = true

# --- Linters ---

[[plugin]]
name = "ruff"
drivers = ["lint"]

[[plugin]]
name = "bandit"

[[plugin]]
name = "radarlint-python"
mode = "comment"

# --- Security ---

[[plugin]]
name = "trufflehog"

# --- CI ---

[[plugin]]
name = "actionlint"

# --- Triage: suppress false positives ---

# B101 (assert usage) is normal in pytest tests and examples
[[triage]]
match.rules = ["bandit:B101"]
match.file_patterns = ["tests/**"]
set.ignored = true

# Subprocess usage is intentional for process management (nvidia-smi, node, kill)
[[triage]]
match.rules = ["bandit:B404", "bandit:B603", "bandit:B607", "bandit:B606"]
set.ignored = true

# Try/except/pass|continue is intentional for optional features (e.g. JAX, DiffeRT)
[[triage]]
match.rules = ["bandit:B110", "bandit:B112"]
set.ignored = true

# Temp file usage is intentional for cache directories
[[triage]]
match.rules = ["bandit:B108"]
set.ignored = true

# Complexity in tools and tests is acceptable (not production code)
[[triage]]
match.rules = ["radarlint-python:python:S3776", "radarlint-python:python:S1192"]
match.file_patterns = ["tools/**", "tests/**"]
set.ignored = true

# Physics naming conventions: A_ab, D_max, T0, G_4cm2, S_inc, etc. follow
# standard electromagnetic/dosimetry notation, not Python naming style
[[triage]]
match.rules = [
  "radarlint-python:python:S117",  # local/param naming
  "radarlint-python:python:S116",  # field naming
  "radarlint-python:python:S100",  # method naming (_get_G)
  "radarlint-python:python:S1542", # function naming (_inject_curvature_H, tissue_T0)
]
match.file_patterns = [
  "src/aegis/**",
]
set.ignored = true

