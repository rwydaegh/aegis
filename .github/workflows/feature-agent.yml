name: Feature agent

on:
  schedule:
    - cron: "45 */3 * * *"  # Every 3 hours, offset 45min so QA+review finish first
  workflow_dispatch: {}

concurrency:
  group: feature-agent
  cancel-in-progress: true

jobs:
  feature:
    runs-on: ubicloud-standard-2
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get recent activity
        id: context
        run: |
          RECENT=$(git log --oneline --since="3 days ago" --no-merges -50)
          if [ -z "$RECENT" ]; then
            RECENT=$(git log --oneline -20 --no-merges)
          fi
          {
            echo "log<<COMMITS_EOF"
            echo "$RECENT"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

          # Get open issues for context on what users want
          ISSUES=$(gh issue list --state open --limit 10 --json number,title,labels --jq '.[] | "#\(.number) [\(.labels | map(.name) | join(","))] \(.title)"' 2>/dev/null || echo "")
          {
            echo "issues<<ISSUES_EOF"
            echo "$ISSUES"
            echo "ISSUES_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Load prompt
        id: load_prompt
        run: |
          {
            echo "content<<PROMPT_EOF"
            cat agent_hq/prompts/feature-agent.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/aegis-overview.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/environment.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/how-to-ship.md
            echo ""
            echo "---"
            echo ""
            cat agent_hq/context/not-bugs.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run feature agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-7 --allowedTools "Edit,Read,Write,Glob,Grep,Bash(*),WebSearch,WebFetch,Agent"'
          prompt: |
            ${{ steps.load_prompt.outputs.content }}

            ## Recent commits
            ```
            ${{ steps.context.outputs.log }}
            ```

            ## Open issues
            ```
            ${{ steps.context.outputs.issues }}
            ```
