[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "aegis"
version = "0.0.1"
description = "GPU-accelerated geometric dosimetry engine for wireless exposure assessment."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "rwydaegh", email = "robin.wydaeghe@ugent.be"}]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
gpu = ["jax[cuda]>=0.4.20"]
viz = [
    "matplotlib>=3.7",
    "pyvista>=0.43",
    "trame>=3.0",
    "scienceplots>=2.1.0",
]
rt = ["differt>=0.7.0"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
    "mkdocstrings[python]>=0.24",
    "mkdocs-minify-plugin>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.90",
    "ruff>=0.4",
    "pre-commit>=3.5",
    "codespell>=2.2",
    "miepython>=2.6",
]
all = ["aegis[gpu,viz,rt,docs,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that need mesh data or take >10s",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["aegis"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]
