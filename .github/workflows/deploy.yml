name: Deploy

on:
  push:
    branches: [master]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubicloud-standard-2
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0   # full history for git-based versioning

      - name: Derive version from git tags
        id: version
        run: |
          RAW=$(git describe --tags --always | sed 's/^v//')
          # Convert git describe format (0.16.1-4-gabcdef) to PEP 440 (0.16.1.dev4+gabcdef)
          PEP440=$(echo "$RAW" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g(.+)$/\1.dev\2+g\3/')
          echo "value=$PEP440" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aegis-web/package-lock.json

      - name: Build React frontend
        working-directory: aegis-web
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npm ci
          npm run build
          node scripts/copy-to-flask.mjs

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build docs
        run: |
          pip install uv
          uv pip install --system ".[docs]"
          python -m mkdocs build

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          build-args: |
            CACHE_BUST=${{ github.sha }}
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Deploy to Hetzner
        if: vars.HETZNER_HOST != ''
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ vars.HETZNER_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key root@$HOST"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
            docker-compose.yml Caddyfile root@$HOST:/opt/aegis/
          $SSH "echo '$GH_TOKEN' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
            cd /opt/aegis && \
            grep -q AEGIS_GIT_COMMIT app.env && sed -i 's/^AEGIS_GIT_COMMIT=.*/AEGIS_GIT_COMMIT=${{ github.sha }}/' app.env || echo 'AEGIS_GIT_COMMIT=${{ github.sha }}' >> app.env && \
            docker compose pull && docker compose up -d && docker image prune -f"

      - name: Health check
        if: vars.HETZNER_HOST != ''
        env:
          DOMAIN: aegis.waves-ugent.be
        run: |
          sleep 15
          for i in 1 2 3; do
            if curl -sf --max-time 10 "https://$DOMAIN/api/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 3 attempts"
          exit 1

      - name: Sentry release tracking
        if: vars.HETZNER_HOST != ''
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then exit 0; fi
          npm install -g @sentry/cli
          export SENTRY_URL=https://de.sentry.io
          sentry-cli releases new "${{ github.sha }}"
          sentry-cli releases set-commits "${{ github.sha }}" --auto
          sentry-cli releases finalize "${{ github.sha }}"
          sentry-cli releases deploys "${{ github.sha }}" new -e production

  loc-badge:
    runs-on: ubicloud-standard-2
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Install scc
        run: |
          curl -sL https://github.com/boyter/scc/releases/download/v3.4.0/scc_Linux_x86_64.tar.gz | tar xz
          sudo mv scc /usr/local/bin/

      - name: Count lines of code
        id: loc
        run: |
          LINES=$(scc --no-cocomo --no-complexity -f json src/ aegis-web/src/ tests/ | jq '[.[].Code] | add')
          echo "lines=$LINES" >> "$GITHUB_OUTPUT"

      - name: Update badge gist
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.LOC_GIST_ID }}
          filename: loc.json
          label: lines of code
          message: ${{ steps.loc.outputs.lines }}
          color: blue

  modal-deploy:
    needs: ci
    runs-on: ubicloud-standard-2
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Modal
        run: pip install "modal>=0.73"
      - name: Install AEGIS (for mount)
        run: pip install -e .
      - name: Deploy Modal app
        run: modal deploy src/aegis/modal_rt/__init__.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
