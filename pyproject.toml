[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
name = "aegis"
dynamic = ["version"]
description = "GPU-accelerated geometric dosimetry engine for wireless exposure assessment."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Proprietary"}
authors = [{name = "rwydaegh", email = "robin.wydaeghe@ugent.be"}]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10,<2",
    "pyyaml>=6.0.3",
]

[project.scripts]
aegis = "aegis.__main__:main"
aegis-run = "aegis.run:main"

[project.optional-dependencies]
fast = ["numba>=0.59"]
jax = ["jax>=0.4.20"]
gpu = ["jax[cuda12]>=0.4.20"]
viz = [
    "matplotlib>=3.10.8",
    "plotly>=5.18",
    "pyvista>=0.43",
    "trame>=3.0",
    "scienceplots>=2.1.0",
]
viewer = ["flask>=3.1.3", "psutil>=5.9", "differt @ git+https://github.com/rwydaegh/DiffeRT.git#subdirectory=differt", "modal>=0.73", "requests>=2.31", "pandas>=3.0.2", "geopy>=2.4", "Pillow>=12.2", "pyarrow>=14.0"]
rt = ["differt @ git+https://github.com/rwydaegh/DiffeRT.git#subdirectory=differt"]
sionna = ["sionna-rt>=2.0,<3.0"]
modal = ["modal>=0.73"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.21.2,<10.22",
    "pygments>=2.20,<2.21",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-minify-plugin>=0.7",
    "jupytext>=1.16",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.152.1",
    "ruff>=0.15.11",
    "basedpyright>=1.21",
    "pre-commit>=4.5.1",
    "codespell>=2.4.2",
    "miepython>=3.2.0",
    "requests>=2.31",
    "pandas>=3.0.2",
    "pyarrow>=14.0",
]
body = ["smplx>=0.1.28", "torch>=2.11.0", "pygltflib>=1.16.5"]
benchmark = ["pytest-codspeed>=4.4.0"]
cloud = ["requests>=2.31"]
all = ["aegis[jax,gpu,viz,viewer,rt,sionna,docs,dev,cloud,modal,benchmark]"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/aegis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]
artifacts = ["src/aegis/viewer/static/**"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["src/aegis/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PT"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
pythonpath = [".", "src"]
markers = [
    "slow: tests that need mesh data or take >10s",
]
# pytest-xdist: two workers (balance of throughput vs RAM; avoid -n auto on dev machines)
addopts = "-ra --strict-markers --import-mode=prepend -n 2"

[tool.codespell]
ignore-words-list = "te,nd,ue,lod,coner"

[tool.coverage.run]
source = ["src/aegis"]
branch = true
parallel = true
# Omitted paths: optional Sionna bridge, viewer CLI, voxel pipeline glue
omit = [
    "*/viewer/__main__.py",
    "*/viewer/pipeline.py",
    "*/integration/sionna.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

[tool.basedpyright]
include = ["src/aegis/kernels", "src/aegis/compliance", "src/aegis/viewer/routes"]
# Kernels and compliance are strict. Routes use a custom ruleset (see below) that
# demotes reportUnknown* boundary noise (Flask/numpy untyped surfaces) while
# keeping real type bugs (Optional handling, return type mismatches, bad args to
# typed APIs) as errors. Adding routes to strict would force reportUnknown* back
# to error level regardless of the global overrides.
strict = ["src/aegis/kernels", "src/aegis/compliance"]
pythonVersion = "3.12"
reportMissingTypeStubs = false
# JAX and numpy return `Any` from many ops because stubs are incomplete; forcing
# casts at every boundary is noise, not safety. Keep the signal visible at
# information level and address real shape bugs via jaxtyping later if needed.
reportAny = "information"
reportExplicitAny = "information"
# Unparameterized generics (e.g. `dict`, `list`) pervade the Flask/numpy edges;
# requiring explicit type args across route signatures is churn, not safety.
reportMissingTypeArgument = "information"
# f-string line wrapping ("foo " f"bar") is standard Python; not a real bug.
reportImplicitStringConcatenation = "none"

# Routes get an explicit ruleset: strict-equivalent bug-catching checks enabled
# as errors, but reportUnknown*/reportMissingType* demoted to information since
# Flask's request.get_json(), request.args, and numpy ops return untyped values
# at HTTP boundaries. TypedDict'ing every request body would be pure churn.
reportArgumentType = "error"
reportReturnType = "error"
reportAssignmentType = "error"
reportCallIssue = "error"
reportIndexIssue = "error"
reportOperatorIssue = "error"
reportAttributeAccessIssue = "error"
reportGeneralTypeIssues = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportUnboundVariable = "error"
reportUndefinedVariable = "error"
# Underscore-prefixed helpers shared across sibling modules in the routes package
# are an intentional "package-private" pattern, not accidental API leakage.
reportPrivateUsage = "information"
reportTypedDictNotRequiredAccess = "error"
reportRedeclaration = "error"
# compute/rt.py, sionna_rt.py, voxel_rt.py, scenes.py deliberately import back
# from aegis.viewer.routes.compute (the package) to expose test-mockable proxies.
# This is an intentional re-export pattern; the cycle is structural, not a bug.
reportImportCycles = "warning"
reportInvalidTypeForm = "error"
reportInvalidTypeVarUse = "error"
reportUnusedFunction = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportUnusedParameter = "warning"
reportUnusedCallResult = "none"
reportUntypedFunctionDecorator = "warning"
