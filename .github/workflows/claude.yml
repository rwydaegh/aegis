name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # Responds to @claude mentions in issues, comments, and PR reviews
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Triggered when the 'qa-bot' label is added to an issue (from QA swarm/agent)
  qa-fix:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'qa-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Run Claude Code on QA issue
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          include_comments_by_actor: "claude[bot]"
          track_progress: true
          prompt: |
            Fix this bug. The issue body has reproduction steps from the automated QA agent.
            There are no Sentry breadcrumbs -- rely on the description and steps to reproduce.

            After committing and pushing your fix, you MUST run `gh pr create` yourself to open
            a pull request, then immediately run `gh pr merge --squash --delete-branch` to merge it.
            Do not stop at just pushing a branch. The full cycle is: fix -> commit -> push -> pr create -> pr merge.
            Add "Fixes #${{ github.event.issue.number }}" to the PR body so it auto-closes the issue on merge.

  # Triggered when the 'sentry' label is added to an issue
  sentry-fix:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'sentry' &&
      !contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Run Claude Code on Sentry issue
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            Fix this bug. The issue body has the stack trace from Sentry.
            Follow `.claude/rules/sentry-issues.md` for the workflow.

            After committing and pushing your fix, you MUST run `gh pr create` yourself to open
            a pull request, then immediately run `gh pr merge --squash --delete-branch` to merge it.
            Do not stop at just pushing a branch. The full cycle is: fix -> commit -> push -> pr create -> pr merge.
            Add "Fixes #${{ github.event.issue.number }}" to the PR body so it auto-closes the issue on merge.
