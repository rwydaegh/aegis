# Ten cities of differing morphology -> one population-exposure CDF overlay.
# This is the headline deliverable config. Knobs are dialed for tractability on
# CPU (the gram is ~5.6 s/recompute; the deterministic arm is the cost). Fidelity
# knobs (n_agents, window, recompute cadence) are intentionally modest so all ten
# cities land; raise them once the figure exists. The ten cities come from
# run_cities.DEFAULT_CITIES (empty specs + count: 10).
cities:
  count: 10
  radius_m: 180             # fixed analysis area across all cities
  specs: []                 # empty -> DEFAULT_CITIES[:count]
mobility:
  n_agents: 24              # modest crowd per city; grow once the CDF converges
  window_s: 20
  walk_speed_mps: 1.4
  user_fraction: 0.5
  routing: directions       # real street walks (falls back to straight OD per
                            # agent if the Routes API cannot route a pair)
deployment:
  process: ginibre          # NOT YET WIRED: placement is height-band + spacing
  density_source: dataset   # NOT YET WIRED: site count is 3 * densification
  densification: 1.0
  realizations_K: 1         # NOT YET WIRED: single deployment realization
  sectoring:
    sectors: 3
    az_coverage_deg: 120
    max_range_m: 150
    downtilt_deg: 10.0        # urban sectors aim at the street, not the skyline
  equipment:
    name: mmwave_mamimo_28ghz
    array: [8, 8]
    tx_power_dbm: 30
    height_class: rooftop
    freq_hz: 28.0e+9
  precoder: mrt
  # rooftop realism: sites only on roofs in this band (no spires/sheds), panel
  # mounted 2 m above the parapet, z snapped to the traced mesh roof
  site_height_min_m: 8.0
  site_height_max_m: 45.0
  mount_height_m: 2.0
channel:
  # stochastic names the comparison arm used by aegis.study.compare only; the
  # run_cities batch itself is fully deterministic (Sionna RT).
  stochastic: coherent_38901
  los_blend: p_los
  seed: 42
  samples_per_src: 3000000   # ~0.5% off the 30M plateau, ~10x faster per trace
  diffraction: true
  # Gram cost is quadratic in the path count (24 paths -> 30 s, 10 -> ~5 s on
  # 4 CPU cores); the strongest 10 carry the energy. Raise for the paper run.
  max_center_paths: 10
dosimetry:
  level: 7
  peak_sab: false            # headline CDF = scalar x^H Q x (cheap); add peak map later
temporal:
  dt_s: 1.0
  # Keep pose and recompute EQUAL and aligned: the loop rebuilds sector grams
  # on pose frames anyway, and an unequal split leaves the gram built for a
  # stale body position. 5 s also bounds the translation-phasor extrapolation
  # to ~7 m between re-traces (it was 14 m, far beyond plane-wave validity).
  pose_period: 5
  recompute_period: 5
